<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#4f35ba" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="공정별 유해화학물질 취급 정보 (MSDS 요약, 응급처치 방법, 보호구 착용 기준, 비상대피로 위치)" />
  <title>유해화학물질 정보제공</title>

  <!-- 글꼴 (불러오지 못하면 기기 기본 글꼴로 표시) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <!--
  ======================================================================
   이미지 파일 배치 안내  (기본: index.html 과 같은 폴더 / 스크립트의 IMAGE_BASE 로 변경)
  ----------------------------------------------------------------------
   ■ 공정 코드
      tdm12 = #1, 2 TDM Unit    tdm3 = #3 TDM Unit    nomndm = NOM/NDM Unit
      nash  = NaSH Unit         li2s = Li2S Unit      lp1    = LP-1 Unit

   ■ 공정별 항목 (공정 코드마다 1장씩)
      응급처치 방법                 {공정코드}-firstaid.png   예) tdm12-firstaid.png
      취급 물질별 보호구 착용 기준    {공정코드}-ppe.png        예) tdm12-ppe.png
      비상대피로 위치               {공정코드}-evac.png       예) tdm12-evac.png

   ■ MSDS 요약 정보 (물질별 1장 — 같은 물질은 여러 공정이 같은 파일을 사용)
      msds-h2s.png    msds-pt.png     msds-nom.png    msds-1-octene.png
      msds-naoh.png   msds-nash.png   msds-lioh.png

   ■ 공통 항목
      보호구 종류                    common-ppe-types.png
      세안기, 보안경 보관함 위치       common-eyewash.png
      공정 내 비상대피로 위치         evac-map.svg  (공장 배치도 — 확대해도 선명한 벡터 그림)
                                     + 원형 버튼별 사진 evac-point-1.png, evac-point-2.png …
                                     버튼 위치·이름·사진은 스크립트의 EVAC_MAP 에서 설정

   ■ 로고   logo.png  (없으면 글자 로고로 자동 대체)

   ■ QR 바로가기 주소 — 공정 출입구 QR마다 해당 공정 화면이 바로 열림
      https://(사이트 주소)/index.html?u=tdm12      ← 끝의 공정 코드만 바꿔서 사용
      ?u= 없이 접속하면 첫 화면(공정 선택)부터 시작

   ■ 배포 전 확인
      REVIEW_BYPASS = false  (위치 확인 화면 오른쪽 위의 검토용 숨은 버튼 제거)
  ======================================================================
  -->

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { -webkit-tap-highlight-color: transparent; }

    /* ================= 색상 체계 =================
       보라  : 공정별 정보 (선택한 공정에만 해당)
       주황  : 공장 공통 정보 (모든 공정에 동일 적용)
       녹색  : 비상대피 표시 (안전보건표지의 '안내' 색 — 비상구·피난 표지와 같은 의미)
    ============================================== */
    :root {
      --ink: #1b1630;
      --ink-2: #433d58;
      --muted: #6c6684;
      --faint: #a7a1bb;
      --line: #e8e4f1;
      --bg: #f4f2f9;

      --p-50: #f5f2ff;  --p-100: #ebe5ff; --p-200: #d8cdfb; --p-400: #9b85ee;
      --p-500: #7b61e4; --p-600: #6548d6; --p-700: #5236bd; --p-800: #40298f;

      --o-50: #fff5eb;  --o-100: #ffe9d4; --o-200: #fbd0a6; --o-400: #f7a24f;
      --o-500: #f28a2e; --o-600: #e2761b; --o-700: #a64f0d; --o-900: #2d1603;

      --g-50: #eaf8f1;  --g-100: #c9ecdb; --g-500: #15a06b; --g-600: #0b7f53; --g-800: #08553a;

      --sh-1: 0 1px 2px rgba(27,22,48,.05), 0 6px 18px rgba(27,22,48,.06);
      --sh-2: 0 14px 34px rgba(64,41,143,.16);
      --ease: cubic-bezier(.2,.7,.2,1);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);

      --grad-p:
        radial-gradient(85% 90% at 108% -12%, rgba(247,162,79,.72) 0%, rgba(247,162,79,0) 62%),
        linear-gradient(158deg, #452ca9 0%, #5b3fcc 52%, #7157dd 100%);
      --grad-o:
        radial-gradient(70% 80% at 110% -15%, rgba(255,206,140,.45) 0%, rgba(255,206,140,0) 60%),
        linear-gradient(158deg, #f47c1c 0%, #ee6f15 52%, #e8650f 100%);
    }

    body {
      margin: 0; min-height: 100vh;
      background: var(--bg); color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
                   "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", sans-serif;
      font-size: 16px; line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      word-break: keep-all; overflow-wrap: break-word;
    }
    body.no-scroll { overflow: hidden; }
    button { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--p-500); outline-offset: 2px; border-radius: 10px; }
    .ic { display: block; flex: none; }
    button[data-nav] { margin: 0; text-align: left; cursor: pointer; }
    .unit-row, .c-tile, .sub-btn { width: 100%; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4.5px solid var(--p-100); border-top-color: var(--p-500);
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 화면 전환 애니메이션 */
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    @keyframes fade { from { opacity: 0; } }
    .enter .band, .enter .hero { animation: fade .28s ease backwards; }
    .enter .rise { animation: rise .42s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 40ms + 60ms); }

    /* ================= 위치 확인 게이트 ================= */
    .gate {
      position: fixed; inset: 0; z-index: 3000;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 20px calc(24px + var(--safe-b));
      background: var(--grad-p);
    }
    .gate-bypass {
      position: absolute; top: calc(12px + var(--safe-t)); right: 12px;
      width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px;
      background: rgba(255,255,255,.035); cursor: pointer;
    }
    .gate-card {
      width: 100%; max-width: 400px; text-align: center;
      background: #fff; border-radius: 28px; padding: 34px 22px 24px;
      box-shadow: 0 30px 70px rgba(20,10,60,.35);
    }
    .gate .spinner { margin: 0 auto 18px; }
    .gate-icon {
      width: 68px; height: 68px; margin: 0 auto 16px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--p-50); color: var(--p-600);
    }
    .gate-icon.deny { background: #fdecec; color: #c62828; }
    .gate-icon.wait { background: var(--o-50); color: var(--o-700); }
    .gate-title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
    .gate-desc { margin: 10px 0 0; font-size: 15.5px; line-height: 1.7; color: var(--ink-2); }
    .gate-desc b { color: var(--ink); }
    .gate-btn {
      width: 100%; min-height: 56px; margin-top: 22px; border: 0; border-radius: 16px; cursor: pointer;
      background: var(--p-600); color: #fff; font-size: 17px; font-weight: 800;
      box-shadow: 0 10px 24px rgba(101,72,214,.3);
    }

    .app { display: none; }
    body.access-granted .app { display: block; }

    .wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px calc(40px + var(--safe-b)); }

    /* ================= 상단 색띠 (첫 화면 / 각 화면) ================= */
    .hero, .band {
      position: relative; overflow: hidden;
      border-radius: 0 0 30px 30px;
    }
    .hero::after, .band::after {
      content: ""; position: absolute; right: -80px; bottom: -120px;
      width: 250px; height: 250px; border-radius: 50%;
      border: 34px solid rgba(255,255,255,.07); pointer-events: none;
    }
    .band-in { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 0 16px; }

    .hero { color: #fff; background: var(--grad-p); padding: calc(18px + var(--safe-t)) 0 30px; }
    .logo-chip {
      display: inline-flex; align-items: center; height: 32px; padding: 0 11px;
      border-radius: 10px; background: #fff; box-shadow: 0 6px 16px rgba(20,10,60,.18);
    }
    .logo-chip img { display: block; height: 19px; width: auto; }
    .logo-chip span { display: none; font-size: 13px; font-weight: 800; color: var(--p-700); white-space: nowrap; }
    .logo-chip.fallback img { display: none; }
    .logo-chip.fallback span { display: block; }
    /* 첫 화면 제목: 한 줄 + 주황 밑줄, 배경에 분자 구조(벤젠 고리) 선 그림 */
    .hero::after { display: none; }
    .hero-mol {
      position: absolute; right: -34px; top: 50%; transform: translateY(-50%);
      width: 230px; height: 230px; opacity: .2; pointer-events: none;
    }
    .hero-title {
      margin: 22px 0 0; white-space: nowrap;
      font-size: clamp(25px, 8.1vw, 42px); line-height: 1.2; font-weight: 800; letter-spacing: -.045em;
    }
    .hero-title::after {
      content: ""; display: block; width: 2.2em; height: 4px; margin-top: 12px;
      border-radius: 2px; background: #f7963c;
    }
    .hero-title:focus, .band-title:focus { outline: none; }

    .band { padding: calc(10px + var(--safe-t)) 0 26px; }
    .band-p { color: #fff; background: var(--grad-p); }
    .band-o { color: #fff; background: var(--grad-o); }
    .band-o .band-title { text-shadow: 0 1px 2px rgba(120,40,0,.28); }
    .band-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
    .pill {
      display: inline-flex; align-items: center; gap: 2px;
      min-height: 42px; max-width: 80%; padding: 0 15px 0 8px;
      border-radius: 999px; cursor: pointer;
      font-size: 15px; font-weight: 800; letter-spacing: -.02em;
      background: rgba(255,255,255,.17); border: 1px solid rgba(255,255,255,.28); color: inherit;
    }
    .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill-home { width: 42px; padding: 0; justify-content: center; }
    .band-o .pill { background: rgba(0,0,0,.16); border-color: rgba(255,255,255,.3); }
    .pill:active { transform: scale(.96); }
    .band-title {
      margin: 20px 0 0; font-size: 28px; line-height: 1.22; font-weight: 800; letter-spacing: -.04em;
    }
    .band-title.xl { margin-top: 18px; font-size: clamp(30px, 9.4vw, 46px); line-height: 1.1; letter-spacing: -.045em; }
    .band-title .unit-sfx { color: inherit; opacity: .82; }
    .band-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .band-chip {
      padding: 4px 11px; border-radius: 9px; font-size: 14.5px; font-weight: 800;
      background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3);
    }

    /* 스크롤 시 나타나는 상단 막대 */
    .appbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      transform: translateY(-105%); visibility: hidden;
      transition: transform .24s var(--ease), visibility 0s .24s;
      box-shadow: 0 6px 20px rgba(27,22,48,.16);
    }
    .appbar.show { transform: none; visibility: visible; transition: transform .24s var(--ease), visibility 0s; }
    .appbar-p { background: #4f35ba; color: #fff; }
    .appbar-o { background: #e8650f; color: #fff; }
    .appbar-in {
      max-width: 752px; margin: 0 auto;
      display: flex; align-items: center; gap: 2px;
      padding: calc(4px + var(--safe-t)) 12px 4px 4px;
    }
    .ab-back {
      width: 48px; height: 48px; flex: none; border: 0; border-radius: 14px; cursor: pointer;
      display: grid; place-items: center; background: none; color: inherit;
    }
    .ab-back:active { background: rgba(255,255,255,.16); }
    .ab-title {
      flex: 1; min-width: 0; font-size: 17px; font-weight: 800; letter-spacing: -.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ================= 공정 선택 (첫 화면) ================= */
    .unit-list { display: grid; gap: 8px; }
    .unit-row {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 8px;
      min-height: 60px; padding: 10px 10px 10px 18px;
      background: #fff; border: 1px solid var(--line); border-radius: 18px;
      box-shadow: var(--sh-1);
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    }
    .unit-row::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
      background: linear-gradient(180deg, var(--p-500), var(--p-700));
    }
    .unit-row:active { transform: scale(.985); border-color: var(--p-200); }
    @media (hover: hover) { .unit-row:hover { border-color: var(--p-200); box-shadow: var(--sh-2); } }
    .ur-main {
      flex: 1; min-width: 0;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      column-gap: 10px; row-gap: 5px;
    }
    .ur-name {
      font-size: clamp(19px, 5.8vw, 24px); font-weight: 800;
      letter-spacing: -.035em; line-height: 1.2; color: var(--ink); white-space: nowrap;
    }
    .unit-sfx { font-weight: 700; color: #6a6484; }
    .ur-chips { display: flex; flex-wrap: wrap; gap: 3px; }
    .unit-list.stacked .ur-main { flex-direction: column; align-items: flex-start; row-gap: 3px; }
    .chip {
      display: inline-block; padding: 1px 5px; border-radius: 6px;
      font-size: 11.5px; font-weight: 700; line-height: 1.6; letter-spacing: -.01em;
      background: #f3f1f8; color: var(--ink-2); border: 1px solid #e6e2ef;
    }
    .ur-go { flex: none; color: var(--p-400); }

    /* ================= 공통 항목 (주황 타일) ================= */
    .common-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line);
    }
    .c-tile {
      display: flex; flex-direction: column; gap: 12px;
      min-height: 128px; padding: 14px 11px 14px 12px;
      border-radius: 20px; background: var(--o-50); border: 1.5px solid var(--o-200);
      color: var(--o-900);
      transition: transform .14s ease;
    }
    .c-tile:active { transform: scale(.965); }
    .c-ico {
      width: 48px; height: 48px; border-radius: 15px; flex: none;
      display: grid; place-items: center; color: #fff;
      background: linear-gradient(140deg, #f9a651, #e8761a);
      box-shadow: 0 6px 14px rgba(232,118,26,.3);
    }
    .c-title { font-size: 14.5px; font-weight: 800; line-height: 1.32; letter-spacing: -.035em; }

    /* ================= 공정 화면: 공정별 항목 (보라) ================= */
    .items { display: grid; gap: 10px; }
    .item {
      background: #fff; border: 1px solid var(--p-100); border-radius: 22px;
      box-shadow: var(--sh-1); overflow: hidden;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .item.open { border-color: var(--p-200); box-shadow: var(--sh-2); }
    .item-btn {
      display: flex; align-items: center; gap: 14px; width: 100%;
      min-height: 76px; padding: 14px 14px 14px 14px;
      border: 0; background: none; text-align: left; cursor: pointer;
    }
    .item-btn:active .item-ico { transform: scale(.94); }
    .item-ico {
      width: 52px; height: 52px; border-radius: 16px; flex: none;
      display: grid; place-items: center; color: #fff;
      background: linear-gradient(140deg, var(--p-700), var(--p-500));
      box-shadow: 0 8px 16px rgba(101,72,214,.28);
      transition: transform .14s ease;
    }
    .item-title { flex: 1; min-width: 0; font-size: 18.5px; font-weight: 800; letter-spacing: -.035em; line-height: 1.3; }
    .chev { flex: none; color: var(--faint); display: grid; place-items: center; }
    .item .chev-d .ic { transition: transform .28s var(--ease); }
    .item.open .chev-d .ic { transform: rotate(180deg); color: var(--p-600); }

    .sub-wrap {
      display: grid; grid-template-rows: 0fr; visibility: hidden;
      transition: grid-template-rows .3s var(--ease), visibility 0s .3s;
    }
    .item.open .sub-wrap { grid-template-rows: 1fr; visibility: visible; transition: grid-template-rows .3s var(--ease), visibility 0s; }
    .sub-inner { min-height: 0; overflow: hidden; }
    .sub-grid { display: grid; gap: 8px; padding: 2px 12px 12px; }
    .sub-btn {
      display: flex; align-items: center; gap: 12px;
      min-height: 60px; padding: 9px 10px;
      border-radius: 16px; background: var(--p-50); border: 1px solid var(--p-100);
      transition: transform .12s ease;
    }
    .sub-btn:active { transform: scale(.98); }
    .sub-code {
      flex: none; min-width: 74px; padding: 7px 8px; border-radius: 11px; text-align: center;
      background: #fff; border: 1px solid var(--p-200);
      color: var(--p-700); font-size: 15px; font-weight: 800; letter-spacing: -.02em;
    }
    .sub-label { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; letter-spacing: -.02em; }

    /* ================= 자료 화면 ================= */
    .tabs {
      display: flex; gap: 8px; overflow-x: auto;
      margin: 0 -16px 2px; padding: 2px 16px 18px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: none; display: inline-flex; align-items: center; gap: 7px;
      min-height: 48px; padding: 0 17px; border-radius: 999px;
      border: 1.5px solid var(--p-200); background: #fff;
      color: var(--p-700); font-size: 15.5px; font-weight: 800; white-space: nowrap;
      transition: background .15s ease, color .15s ease;
    }
    .tab small { font-size: 13px; font-weight: 700; color: var(--muted); }
    .tab[aria-current="page"] {
      background: var(--p-600); border-color: var(--p-600); color: #fff;
      box-shadow: 0 8px 18px rgba(101,72,214,.3);
    }
    .tab[aria-current="page"] small { color: rgba(255,255,255,.85); }

    .imgbox { margin: 0; }
    .img-frame {
      position: relative; overflow: hidden;
      background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--sh-1);
    }
    .img-hit { position: relative; display: block; width: 100%; padding: 0; border: 0; background: #fff; cursor: zoom-in; }
    .img-hit img { display: block; width: 100%; height: auto; }
    .img-zoom {
      position: absolute; right: 12px; bottom: 12px;
      width: 46px; height: 46px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(27,22,48,.72); color: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,.2);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .img-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; min-height: 240px; padding: 28px 20px; text-align: center;
    }
    .img-loading .spinner { width: 34px; height: 34px; border-width: 4px; }
    .img-error { background: #fbfaff; }
    .err-ico { color: var(--faint); }
    .err-text { margin: 0; font-size: 15px; font-weight: 800; color: var(--ink-2); }
    .err-file {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px;
      color: var(--muted); background: #f1eff6; padding: 3px 8px; border-radius: 6px; word-break: break-all;
    }
    .err-retry {
      min-height: 44px; padding: 0 20px; border-radius: 999px; cursor: pointer;
      border: 1.5px solid var(--line); background: #fff; font-size: 14.5px; font-weight: 800;
    }

      aspect-ratio: 4 / 3;

    }

      flex: 1; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    /* 확대·이동은 canvas(이미지 + 원형 버튼)에 적용. 손을 떼면 will-change 를 풀어 벡터 지도가 다시 선명하게 그려짐 */
    .viewer-canvas { position: relative; flex: none; transform-origin: center center; }

      min-width: 56px; min-height: 46px; padding: 0 10px; border: 0; border-radius: 13px; cursor: pointer;

  <!-- ================= 위치 확인 게이트 ================= -->

    // 비상대피로: 달리는 사람 (비상구 표지의 인물 형태)
    exit:
      '<circle cx="31.6" cy="7.2" r="5.2"/>' +
      '<path d="M23.6 12.2H32.6C34.2 12.2 35.2 13.8 34.6 15.3L29.6 27C29.1 28.1 28 28.8 26.8 28.8H21.6C19.9 28.8 18.7 27.1 19.3 25.5L21.6 13.9C21.8 12.9 22.6 12.2 23.6 12.2Z"/>' +
      '<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M32.6 14.8L35.6 21.6L41.2 22.2" stroke-width="5.2"/>' +
        '<path d="M24.4 14L17.6 15.8L13.8 21.4" stroke-width="5.2"/>' +
        '<path d="M26.4 26.8L31.2 33.4L31.4 43.8" stroke-width="5.8"/>' +
        '<path d="M22.4 26.4L17.4 34.2L10.6 30.6" stroke-width="5.8"/>' +
      '</g>',
    // 방독마스크: 전면형 안면부 + 시야창 + 좌우 정화통
    gasmask:
      '<mask id="{id}"><rect width="48" height="48" fill="#fff"/>' +
        '<path d="M16.4 10.2H31.6C33.4 10.2 34.8 11.6 34.8 13.4V16.8C34.8 18.7 33.3 20.2 31.4 20.2H27.7C26.5 20.2 25.5 19.5 25.1 18.4L24 15.8L22.9 18.4C22.5 19.5 21.5 20.2 20.3 20.2H16.6C14.7 20.2 13.2 18.7 13.2 16.8V13.4C13.2 11.6 14.6 10.2 16.4 10.2Z" fill="#000"/>' +
        '<circle cx="11" cy="32" r="9" fill="#000"/><circle cx="37" cy="32" r="9" fill="#000"/><circle cx="24" cy="29.2" r="3" fill="#000"/>' +
      '</mask>' +
      '<path mask="url(#{id})" d="M24 4C33 4 39 9.6 39 17.6C39 26 33.6 33 24 35.5C14.4 33 9 26 9 17.6C9 9.6 15 4 24 4Z"/>' +
      '<circle cx="24" cy="29.2" r="1.6"/>' +
      '<rect x="3.5" y="26" width="15" height="12" rx="3" transform="rotate(-18 11 32)"/>' +
      '<rect x="29.5" y="26" width="15" height="12" rx="3" transform="rotate(18 37 32)"/>',
    // 세안기: 세안장치 표지 형태 — 노즐에서 점선 물줄기가 눈으로 + 응급 십자
    eyewash:
      '<g fill="none" stroke="currentColor" stroke-width="3">' +
        '<path d="M17 3V10.4M9 10.4H25" stroke-linecap="round"/>' +
        '<path d="M17 13.6V27.2M12.2 13.8L5.2 24.8M21.8 13.8L28.8 24.8" stroke-dasharray="3 2.6"/>' +
        '<path d="M3.2 38.4C7.4 32.6 12 30.4 17 30.4S26.6 32.6 30.8 38.4C26.6 44.2 22 46.4 17 46.4S7.4 44.2 3.2 38.4Z" stroke-linejoin="round"/>' +
        '<circle cx="17" cy="38.4" r="4.8"/>' +
      '</g>' +
      '<circle cx="17" cy="38.4" r="2"/>' +
      '<path d="M35.2 4H40.4V9.4H45.8V14.6H40.4V20H35.2V14.6H29.8V9.4H35.2Z"/>'
  };
  let pictoSeq = 0;
  function picto(name, size) {
    const id = "pm" + (++pictoSeq);
    return '<svg class="ic" width="' + size + '" height="' + size + '" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true" focusable="false">' +
           PICTOS[name].split("{id}").join(id) + '</svg>';
  }

  /* =====================================================================
   * 3. 도우미
   * =================================================================== */
  const $ = function (sel) { return document.querySelector(sel); };
  const view = $("#view");
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function byKey(list, k) { const m = {}; list.forEach(function (x) { m[x[k]] = x; }); return m; }
  const UNIT_BY_ID = byKey(UNITS, "id");
  const UNIT_ITEM_BY_KEY = byKey(UNIT_ITEMS, "key");
  const COMMON_BY_KEY = byKey(COMMON_ITEMS, "key");
  function unitFull(u) { return u.name + " Unit"; }
  function unitHtml(u) { return esc(u.name) + ' <span class="unit-sfx">Unit</span>'; }
  function codes(u) { return u.substances.map(function (k) { return SUBSTANCES[k].code; }).join(", "); }
  function tryHistory(fn) { try { fn(); return true; } catch (e) { return false; } }
  function hstate() { try { return history.state || {}; } catch (e) { return {}; } }

  /* =====================================================================
   * 4. 화면 주소
   *    #/                       공정 선택 (첫 화면)
   *    #/u/{공정}                선택 공정
   *    #/u/{공정}/{항목}[/{물질}]  공정별 자료
   *    #/u/{공정}/c/{항목}        공통 자료 (공정 화면에서 들어온 경우)
   *    #/c/{항목}                공통 자료 (첫 화면에서 들어온 경우)
   * =================================================================== */
  function parseRoute(hash) {
    const p = String(hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    if (p[0] === "c" && COMMON_BY_KEY[p[1]]) return { view: "common", unit: null, item: COMMON_BY_KEY[p[1]] };
    if (p[0] !== "u" || !UNIT_BY_ID[p[1]]) return { view: "home" };
    const unit = UNIT_BY_ID[p[1]];
    if (p[2] === "c" && COMMON_BY_KEY[p[3]]) return { view: "common", unit: unit, item: COMMON_BY_KEY[p[3]] };
    const item = UNIT_ITEM_BY_KEY[p[2]];
    if (!item) return { view: "unit", unit: unit };
    const r = { view: "item", unit: unit, item: item };
    if (item.type === "msds") r.sub = unit.substances.indexOf(p[3]) >= 0 ? p[3] : unit.substances[0];
    return r;
  }
  function hashOf(r) {
    if (r.view === "home") return "#/";
    if (r.view === "unit") return "#/u/" + r.unit.id;
    if (r.view === "common") return (r.unit ? "#/u/" + r.unit.id + "/c/" : "#/c/") + r.item.key;
    return "#/u/" + r.unit.id + "/" + r.item.key + (r.sub ? "/" + r.sub : "");
  }
  function parentOf(r) {
    if ((r.view === "item" || r.view === "common") && r.unit) return { view: "unit", unit: r.unit };
    return { view: "home" };
  }
  function backLabel(r) {
    const p = parentOf(r);
    return p.view === "unit" ? unitFull(p.unit) : "공정 선택";
  }
  function titleOf(r) {
    const base = "유해화학물질 정보제공";
    if (r.view === "home") return base;
    if (r.view === "unit") return unitFull(r.unit) + " | " + base;
    return r.item.title + (r.unit ? " · " + unitFull(r.unit) : "") + " | " + base;
  }

  /* =====================================================================
   * 5. 화면 그리기
   * =================================================================== */
  let currentHash = null;   // 지금 그려진 화면
  let expanded = null;      // 펼쳐진 항목 (MSDS)

  // 상단 색띠 + 스크롤 시 나타나는 막대
  function band(o) {
    const home = o.home
      ? '<button type="button" class="pill pill-home" data-nav="#/" aria-label="처음 화면으로">' + svg("home", 20) + '</button>' : '';
    return '<header class="band band-' + o.tone + '"><div class="band-in">' +
        '<div class="band-nav">' +
          '<button type="button" class="pill" data-back aria-label="뒤로: ' + esc(o.back) + '">' +
            svg("back", 20, 2.4) + '<span>' + esc(o.back) + '</span></button>' + home +
        '</div>' +
        '<h1 class="band-title' + (o.xl ? ' xl' : '') + '" tabindex="-1" data-focus>' + (o.titleHtml || esc(o.title)) + '</h1>' +
        (o.chips || '') +
      '</div></header>' +
      '<div class="appbar appbar-' + o.tone + '" id="appbar" aria-hidden="true"><div class="appbar-in">' +
        '<button type="button" class="ab-back" data-back tabindex="-1" aria-label="뒤로: ' + esc(o.back) + '">' +
          svg("back", 24, 2.4) + '</button>' +
        '<span class="ab-title">' + esc(o.title) + '</span>' +
      '</div></div>';
  }

  function unitRow(u, i) {
    const chips = u.substances.map(function (k) {
      return '<span class="chip">' + esc(SUBSTANCES[k].code) + '</span>';
    }).join("");
    return '<button type="button" class="unit-row rise" style="--i:' + i + '" data-nav="#/u/' + u.id + '" ' +
        'aria-label="' + esc(unitFull(u)) + ', 취급 물질 ' + esc(codes(u)) + '">' +
      '<span class="ur-main"><span class="ur-name">' + unitHtml(u) + '</span>' +
        '<span class="ur-chips">' + chips + '</span></span>' +
      '<span class="ur-go">' + svg("chevR", 20, 2.6) + '</span>' +
      '</button>';
  }

  function commonGrid(unit, start) {
    const base = unit ? "#/u/" + unit.id + "/c/" : "#/c/";
    return '<nav class="common-grid" aria-label="공통 항목">' + COMMON_ITEMS.map(function (c, i) {
      return '<button type="button" class="c-tile rise" style="--i:' + (start + i) + '" data-nav="' + base + c.key + '">' +
        '<span class="c-ico">' + picto(c.icon, 34) + '</span>' +
        '<span class="c-title">' + esc(c.title) + '</span></button>';
    }).join("") + '</nav>';
  }

  function unitItem(u, it, i) {
    if (it.type === "msds") {
      const open = expanded === "msds";
      const subs = u.substances.map(function (k) {
        const s = SUBSTANCES[k];
        return '<button type="button" class="sub-btn" data-nav="#/u/' + u.id + '/msds/' + k + '">' +
          '<span class="sub-code">' + esc(s.code) + '</span>' +
          '<span class="sub-label">' + esc(s.label) + '</span>' +
          '<span class="chev">' + svg("chevR", 18) + '</span></button>';
      }).join("");
      return '<div class="item rise' + (open ? ' open' : '') + '" style="--i:' + i + '">' +
        '<button type="button" class="item-btn" data-toggle="msds" aria-expanded="' + open + '" aria-controls="sub-msds">' +
          '<span class="item-ico">' + picto(it.icon, 36) + '</span>' +
          '<span class="item-title">' + esc(it.title) + '</span>' +
          '<span class="chev chev-d">' + svg("chevD", 22) + '</span>' +
        '</button>' +
        '<div class="sub-wrap" id="sub-msds"><div class="sub-inner"><div class="sub-grid">' + subs + '</div></div></div>' +
      '</div>';
    }
    return '<div class="item rise" style="--i:' + i + '"><button type="button" class="item-btn" data-nav="#/u/' + u.id + '/' + it.key + '">' +
      '<span class="item-ico">' + picto(it.icon, 36) + '</span>' +
      '<span class="item-title">' + esc(it.title) + '</span>' +
      '<span class="chev">' + svg("chevR", 22) + '</span></button></div>';
  }

  function imageBlock(file, label) {
    const src = IMAGE_BASE + file;
    return '<figure class="imgbox rise" style="--i:1" data-src="' + esc(src) + '" data-label="' + esc(label) + '">' +
      '<div class="img-frame">' +
        '<div class="img-state img-loading"><span class="spinner" aria-label="불러오는 중"></span></div>' +
        '<button type="button" class="img-hit" data-zoom hidden aria-label="' + esc(label) + ' 크게 보기">' +
          '<img alt="' + esc(label) + '">' +
          '<span class="img-zoom">' + svg("zoom", 22) + '</span>' +
        '</button>' +
        '<div class="img-state img-error" hidden>' +
          '<span class="err-ico">' + svg("image", 32) + '</span>' +
          '<p class="err-text"></p>' +
          '<code class="err-file">' + esc(file) + '</code>' +
          '<button type="button" class="err-retry">다시 시도</button>' +
        '</div>' +
      '</div></figure>';
  }

  function evacMap() {
    const m = EVAC_MAP;
    if (!m.image) {
      return '<div class="evac rise" style="--i:1"><div class="evac-empty">' +
          '<span class="evac-empty-ico">' + svg("map", 32) + '</span>' +
          '<p class="evac-empty-title">공정 지도 준비 중</p>' +
        '</div></div>';
    }
    const legend = m.pins.map(function (p, i) {
      return '<li><button type="button" class="legend-btn" data-pin="' + i + '">' +
        '<span class="pin-mini">' + esc(p.no) + '</span><span class="t">' + esc(p.label) + '</span>' +
        '<span class="chev">' + svg("chevR", 18) + '</span></button></li>';
    }).join("");
    return '<div class="evac rise" style="--i:1">' +
        '<div class="evac-scroll"><div class="evac-canvas" style="width:' + esc(m.canvasWidth || "100%") + '">' +
          '<button type="button" class="evac-open" data-evac-open tabindex="-1" aria-label="공장 배치도 크게 보기">' +
            '<img src="' + esc(IMAGE_BASE + m.image) + '" alt="공정 내 비상대피로 지도 (공장 배치도)" draggable="false">' +
          '</button>' + pinButtons(m.pins, "data-pin") +
        '</div></div>' +
        '<div class="evac-error" hidden>' +
          '<span class="err-ico">' + svg("map", 32) + '</span>' +
          '<p class="err-text"></p><code class="err-file">' + esc(m.image) + '</code>' +
        '</div>' +
        '<button type="button" class="evac-bar" data-evac-open>' + svg("zoom", 20) + '<span>지도 크게 보기</span></button>' +
      '</div>' +
      (legend ? '<p class="evac-note rise" style="--i:2">지도의 번호 버튼(또는 아래 목록)을 누르면 비상대피로 사진이 열립니다.</p>' +
                '<ol class="legend rise" style="--i:3" aria-label="비상대피로 목록">' + legend + '</ol>' : '');
  }

  // 원형 버튼 (공정 지도 화면·전체화면 지도 공용)
  function pinButtons(pins, attr) {
    return pins.map(function (p, i) {
      return '<button type="button" class="pin" style="left:' + Number(p.x) + '%;top:' + Number(p.y) + '%" ' + attr + '="' + i +
        '" aria-label="비상대피로 ' + esc(p.no) + ' ' + esc(p.label) + '">' + esc(p.no) + '</button>';
    }).join("");
  }
  function openEvacMap() {
    openViewer(IMAGE_BASE + EVAC_MAP.image, COMMON_BY_KEY["evac-map"].title, EVAC_MAP.pins);
  }
  function openPin(p) {
    openViewer(IMAGE_BASE + p.image, "비상대피로 " + p.no + " · " + p.label);
  }

  // 첫 화면 배경의 분자 구조(벤젠 고리) 선 그림
  const HERO_MOL =
    '<svg class="hero-mol" viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true" focusable="false">' +
      '<path d="M70 40L100 57V92L70 109L40 92V57Z"/><path d="M48 62V87M70 101L92 88M92 62L70 49" stroke-width="3"/>' +
      '<path d="M100 92L130 109V144L100 161L70 144V109"/><path d="M122 114V139M100 153L78 140" stroke-width="3"/>' +
      '<path d="M100 57L130 40L160 57V92L130 109"/><path d="M130 144L160 161M40 92L14 107M70 40V10"/>' +
      '<g fill="#fff" stroke="none"><circle cx="70" cy="10" r="7"/><circle cx="14" cy="107" r="7"/><circle cx="160" cy="161" r="7"/><circle cx="130" cy="40" r="5"/></g>' +
    '</svg>';

  function viewHome() {
    return '<header class="hero">' + HERO_MOL + '<div class="band-in">' +
        '<span class="logo-chip"><img src="' + esc(LOGO_SRC) + '" alt="이수스페셜티케미컬" ' +
          'onerror="this.parentNode.classList.add(\'fallback\')"><span>이수스페셜티케미컬</span></span>' +
        '<h1 class="hero-title" tabindex="-1" data-focus>유해화학물질 정보제공</h1>' +
      '</div></header>' +
      '<main class="wrap">' +
        '<nav class="unit-list" aria-label="공정 선택">' + UNITS.map(unitRow).join("") + '</nav>' +
        commonGrid(null, UNITS.length) +
      '</main>';
  }

  function viewUnit(r) {
    const u = r.unit;
    const chips = '<div class="band-chips"><span class="sr">취급 물질: </span>' + u.substances.map(function (k) {
      return '<span class="band-chip">' + esc(SUBSTANCES[k].code) + '</span>';
    }).join("") + '</div>';
    return band({ tone: "p", back: backLabel(r), title: unitFull(u), titleHtml: unitHtml(u), xl: true, chips: chips }) +
      '<main class="wrap">' +
        '<div class="items">' + UNIT_ITEMS.map(function (it, i) { return unitItem(u, it, i); }).join("") + '</div>' +
        commonGrid(u, UNIT_ITEMS.length) +
      '</main>';
  }

  function viewItem(r) {
    const u = r.unit, it = r.item;
    let top = "", file, label;
    if (it.type === "msds") {
      const s = SUBSTANCES[r.sub];
      top = '<nav class="tabs rise" aria-label="물질 선택">' + u.substances.map(function (k) {
          const x = SUBSTANCES[k];
          return '<button type="button" class="tab" data-nav="#/u/' + u.id + '/msds/' + k + '" data-replace' +
            (k === r.sub ? ' aria-current="page"' : '') + '>' + esc(x.code) + '<small>' + esc(x.label) + '</small></button>';
        }).join("") + '</nav>';
      file = s.file;
      label = s.label + "(" + s.code + ") MSDS 요약 정보";
    } else {
      file = it.file.replace("{u}", u.id);
      label = unitFull(u) + " · " + it.title;
    }
    return band({ tone: "p", back: backLabel(r), home: true, title: it.title }) +
      '<main class="wrap">' + top + imageBlock(file, label) + '</main>';
  }

  function viewCommon(r) {
    const c = r.item;
    const body = c.type === "map" ? evacMap() : imageBlock(c.file, c.title);
    return band({ tone: "o", back: backLabel(r), home: !!r.unit, title: c.title }) +
      '<main class="wrap">' + body + '</main>';
  }

  // 공정 버튼: 한 줄에 안 들어가는 버튼이 하나라도 있으면 전체를 같은 2줄 형태로 맞춤
  function fitUnitRows() {
    const list = view.querySelector(".unit-list");
    if (!list) return;
    list.classList.remove("stacked");
    const wrapped = Array.prototype.some.call(list.querySelectorAll(".ur-main"), function (m) {
      return m.lastElementChild.offsetTop > m.firstElementChild.offsetTop + 4;
    });
    list.classList.toggle("stacked", wrapped);
  }
  window.addEventListener("resize", fitUnitRows);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitUnitRows);

  // 색띠 제목이 화면 밖으로 나가면 상단 막대 표시
  let appbarIO = null;
  function setupAppbar() {
    if (appbarIO) { appbarIO.disconnect(); appbarIO = null; }
    const bar = document.getElementById("appbar");
    const anchor = view.querySelector(".band-title");
    if (!bar || !anchor || !("IntersectionObserver" in window)) return;
    const back = bar.querySelector(".ab-back");
    appbarIO = new IntersectionObserver(function (entries) {
      const e = entries[entries.length - 1];
      const show = !e.isIntersecting && e.boundingClientRect.height > 0 && e.boundingClientRect.bottom < 60;
      bar.classList.toggle("show", show);
      bar.setAttribute("aria-hidden", String(!show));
      back.tabIndex = show ? 0 : -1;
    }, { rootMargin: "-56px 0px 0px 0px", threshold: 0 });
    appbarIO.observe(anchor);
  }

  // 이동 방식
  //  - 일반 브라우저: 브라우저 기록을 사용 (휴대폰 '뒤로' 버튼 연동, 주소로 화면 공유 가능)
  //  - 기록 기능이 막힌 환경(앱 안 파일 미리보기 등): 주소를 바꾸지 않고 화면 안에서만 이동
  //    → 어떤 환경에서도 버튼을 누를 때 '외부 링크' 확인 창이 뜨지 않음
  let memMode = false;
  let memHash = "#/";
  const memStack = [];
  function curHash() { return memMode ? memHash : location.hash; }
  function toMemMode() { memMode = true; memHash = currentHash || "#/"; }

  function render(opts) {
    opts = opts || {};
    const prevY = window.scrollY;
    const r = parseRoute(curHash());
    const key = hashOf(r);
    if (key === currentHash && !opts.force) return;
    if (memMode) memHash = key;
    else if (location.hash !== key && !tryHistory(function () { history.replaceState(hstate(), "", key); })) toMemMode();
    const sameView = opts.keepScroll;
    currentHash = key;

    const st = opts.state || (memMode ? {} : hstate());

  /* =====================================================================

      const loading = box.querySelector(".img-loading");
      const error = box.querySelector(".img-error");
      const src = box.getAttribute("data-src");

      });

  const ACCESS_KEY = "ssc-safety-access";

  function pointInPolygon(lat, lng, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i].lng, yi = poly[i].lat, xj = poly[j].lng, yj = poly[j].lat;

    let min = Infinity;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {

      const bx = poly[i].lng * mLng, by = poly[i].lat * mLat;
      const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
      let t = len2 === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / len2;

    document.body.classList.add("access-granted");
    $("#gate").hidden = true;
    fitUnitRows();
    view.classList.remove("enter"); void view.offsetWidth; view.classList.add("enter");
    const h = view.querySelector("[data-focus]");
    if (h) h.focus({ preventScroll: true });
  }

  function checkLocation() {
    if (!("geolocation" in navigator)) {
      setGate("error", { icon: "alert", tone: "deny", title: "위치를 확인할 수 없습니다",
        desc: "위치 기능을 지원하지 않는 기기 또는 브라우저입니다." });
      return;
    }
    if (window.isSecureContext === false) {
      setGate("error", { icon: "alert", tone: "wait", title: "보안 연결이 필요합니다",
        desc: "https 주소로 접속해 주세요." });
      return;
    }
    setGate("checking", { title: "위치 확인 중" });
    navigator.geolocation.getCurrentPosition(function (pos) {
      if (isWithinFence(pos.coords.latitude, pos.coords.longitude)) {
        grantAccess(true);
      } else {
        setGate("deny", {
          icon: "ban", tone: "deny", title: "접근 구역이 아닙니다",
          desc: "이 안내는 <b>공장 구역</b>에서, <b>관계자에 한하여</b> 이용할 수 있습니다.",
          btnText: "다시 시도"
        });
      }
    }, function (err) {
      let msg;
      if (err.code === 1) msg = "브라우저 설정에서 위치 권한을 허용해 주세요.";
      else if (err.code === 2) msg = "GPS 신호를 찾을 수 없습니다.";
      else msg = "위치 확인 시간이 초과되었습니다.";
      setGate("error", { icon: "pin", tone: "wait", title: "위치 확인이 필요합니다", desc: msg, btnText: "다시 시도" });
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }
  $("#gate-btn").addEventListener("click", checkLocation);

  /* =====================================================================
   * 11. 시작
   * =================================================================== */
  (function start() {
    // QR 바로가기: index.html?u=tdm12 → 해당 공정 화면
    let startHash = location.hash, qs = "";
    try {
      const params = new URLSearchParams(location.search);
      const u = params.get("u");
      if (u && UNIT_BY_ID[u] && (!startHash || startHash === "#" || startHash === "#/")) startHash = "#/u/" + u;
      params.delete("u");
      qs = params.toString();
    } catch (e) { /* 무시 */ }
    const ok = tryHistory(function () {
      history.replaceState(Object.assign({ depth: 0 }, hstate()), "",
        location.pathname + (qs ? "?" + qs : "") + (startHash || "#/"));
    });
    if (!ok) { memMode = true; memHash = startHash || "#/"; }
    try { history.scrollRestoration = "manual"; } catch (e) { /* 무시 */ }

    render({ restore: true });
    updateOnline();

    if (REVIEW_BYPASS) {
      const b = $("#gate-bypass");
      b.hidden = false;
      b.addEventListener("click", function () { grantAccess(false); });
    }
    if (hasRecentAccess()) grantAccess(false);
    else checkLocation();
  })();
  </script>
</body>
