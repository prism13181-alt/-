<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#4f35ba" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="공정별 유해화학물질 취급 정보 (MSDS 요약, 응급처치 방법, 보호구 착용 기준, 비상대피로 위치)" />
  <title>유해화학물질 정보제공</title>

  <!-- 글꼴 (불러오지 못하면 기기 기본 글꼴로 표시) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <!--
  ======================================================================
   이미지 파일 배치 안내  (기본: index.html 과 같은 폴더 / 스크립트의 IMAGE_BASE 로 변경)
  ----------------------------------------------------------------------
   ■ 공정 코드
      tdm12 = #1, 2 TDM Unit    tdm3 = #3 TDM Unit    nomndm = NOM/NDM Unit
      nash  = NaSH Unit         li2s = Li2S Unit      lp1    = LP-1 Unit

   ■ 파일 이름은 아래 이름 그대로 (소문자)
      확장자는 .png .jpg .jpeg .webp .gif .svg .bmp .avif 아무거나 (대문자 .PNG .JPG 등도 가능)
      · 휴대폰 사진(HEIC)·윈도우 저장 사진(JFIF)은 JPG로 바꿔서 올려야 함

   ■ 공정별 항목 (공정 코드마다 1장씩)
      응급처치 방법                 {공정코드}-aid     예) tdm12-aid.png
      취급 물질별 보호구 착용 기준    {공정코드}-ppe     예) tdm12-ppe.png

   ■ MSDS 요약 정보 (물질별 1장 — 같은 물질은 여러 공정이 같은 파일을 사용)
      h2s  pt  tdm  nom  octene  naoh  nash  lioh     예) h2s.png

   ■ 공통 항목
      보호구 종류                    ppe              예) ppe.png
      세안기, 보안경 보관함 위치       eye              예) eye.png
      안전장구함 위치                 gear             예) gear.png
      공정 내 비상대피로 위치         배치도는 이 파일 안에 들어 있음 (별도 파일 없음)
                                     지도 위 번호 버튼별 사진:
                                       계단        stair1  ~ stair15      예) stair1.jpg
                                       수직사다리   ladder1 ~ ladder10     예) ladder1.jpg
                                     · 버튼 위치·위치 이름은 스크립트의 EVAC_POINTS 에서 수정

   ■ 로고   logo  (없으면 글자 로고로 자동 대체)

   ■ QR 바로가기 주소 — 공정 출입구 QR마다 해당 공정 화면이 바로 열림
      https://(사이트 주소)/index.html?u=tdm12      ← 끝의 공정 코드만 바꿔서 사용
      ?u= 없이 접속하면 첫 화면(공정 선택)부터 시작

   ■ 배포 전 확인
      REVIEW_BYPASS = false  (위치 확인 화면 오른쪽 위의 검토용 숨은 버튼 제거)
  ======================================================================
  -->

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { -webkit-tap-highlight-color: transparent; }

    /* ================= 색상 체계 =================
       보라  : 공정별 정보 (선택한 공정에만 해당)
       주황  : 공장 공통 정보 (모든 공정에 동일 적용)
       녹색  : 비상대피 표시 (안전보건표지의 '안내' 색 — 비상구·피난 표지와 같은 의미)
    ============================================== */
    :root {
      --ink: #1b1630;
      --ink-2: #433d58;
      --muted: #6c6684;
      --faint: #a7a1bb;
      --line: #e8e4f1;
      --bg: #f4f2f9;

      --p-50: #f5f2ff;  --p-100: #ebe5ff; --p-200: #d8cdfb; --p-400: #9b85ee;
      --p-500: #7b61e4; --p-600: #6548d6; --p-700: #5236bd; --p-800: #40298f;

      --o-50: #fff5eb;  --o-100: #ffe9d4; --o-200: #fbd0a6; --o-400: #f7a24f;
      --o-500: #f28a2e; --o-600: #e2761b; --o-700: #a64f0d; --o-900: #2d1603;

      --g-50: #eaf8f1;  --g-100: #c9ecdb; --g-500: #15a06b; --g-600: #0b7f53; --g-800: #08553a;

      --sh-1: 0 1px 2px rgba(27,22,48,.05), 0 6px 18px rgba(27,22,48,.06);
      --sh-2: 0 14px 34px rgba(64,41,143,.16);
      --ease: cubic-bezier(.2,.7,.2,1);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);

      --grad-p:
        radial-gradient(85% 90% at 108% -12%, rgba(247,162,79,.72) 0%, rgba(247,162,79,0) 62%),
        linear-gradient(158deg, #452ca9 0%, #5b3fcc 52%, #7157dd 100%);
      --grad-o:
        radial-gradient(70% 80% at 110% -15%, rgba(255,206,140,.45) 0%, rgba(255,206,140,0) 60%),
        linear-gradient(158deg, #f47c1c 0%, #ee6f15 52%, #e8650f 100%);
    }

    body {
      margin: 0; min-height: 100vh;
      background: var(--bg); color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
                   "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", sans-serif;
      font-size: 16px; line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      word-break: keep-all; overflow-wrap: break-word;
    }
    body.no-scroll { overflow: hidden; }
    button { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--p-500); outline-offset: 2px; border-radius: 10px; }
    .ic { display: block; flex: none; }
    button[data-nav] { margin: 0; text-align: left; cursor: pointer; }
    .unit-row, .c-tile, .sub-btn { width: 100%; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4.5px solid var(--p-100); border-top-color: var(--p-500);
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 화면 전환 애니메이션 */
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    @keyframes fade { from { opacity: 0; } }
    .enter .band, .enter .hero { animation: fade .28s ease backwards; }
    .enter .rise { animation: rise .42s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 40ms + 60ms); }

    /* ================= 위치 확인 게이트 ================= */
    .gate {
      position: fixed; inset: 0; z-index: 3000;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 20px calc(24px + var(--safe-b));
      background: var(--grad-p);
    }
    .gate-bypass {
      position: absolute; top: calc(12px + var(--safe-t)); right: 12px;
      width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px;
      background: rgba(255,255,255,.035); cursor: pointer;
    }
    .gate-card {
      width: 100%; max-width: 400px; text-align: center;
      background: #fff; border-radius: 28px; padding: 34px 22px 24px;
      box-shadow: 0 30px 70px rgba(20,10,60,.35);
    }
    .gate .spinner { margin: 0 auto 18px; }
    .gate-icon {
      width: 68px; height: 68px; margin: 0 auto 16px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--p-50); color: var(--p-600);
    }
    .gate-icon.deny { background: #fdecec; color: #c62828; }
    .gate-icon.wait { background: var(--o-50); color: var(--o-700); }
    .gate-title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
    .gate-desc { margin: 10px 0 0; font-size: 15.5px; line-height: 1.7; color: var(--ink-2); }
    .gate-desc b { color: var(--ink); }
    .gate-btn {
      width: 100%; min-height: 56px; margin-top: 22px; border: 0; border-radius: 16px; cursor: pointer;
      background: var(--p-600); color: #fff; font-size: 17px; font-weight: 800;
      box-shadow: 0 10px 24px rgba(101,72,214,.3);
    }

    .app { display: none; }
    body.access-granted .app { display: block; }

    .wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px calc(40px + var(--safe-b)); }

    /* ================= 상단 색띠 (첫 화면 / 각 화면) ================= */
    .hero, .band {
      position: relative; overflow: hidden;
      border-radius: 0 0 30px 30px;
    }
    .hero::after, .band::after {
      content: ""; position: absolute; right: -80px; bottom: -120px;
      width: 250px; height: 250px; border-radius: 50%;
      border: 34px solid rgba(255,255,255,.07); pointer-events: none;
    }
    .band-in { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 0 16px; }

    .hero { color: #fff; background: var(--grad-p); padding: calc(18px + var(--safe-t)) 0 30px; }
    .logo-chip {
      display: inline-flex; align-items: center; height: 32px; padding: 0 11px;
      border-radius: 10px; background: #fff; box-shadow: 0 6px 16px rgba(20,10,60,.18);
    }
    .logo-chip img { display: block; height: 19px; width: auto; }
    .logo-chip img[hidden] { display: none; }
    .logo-chip span { display: none; font-size: 13px; font-weight: 800; color: var(--p-700); white-space: nowrap; }
    .logo-chip.fallback img { display: none; }
    .logo-chip.fallback span { display: block; }
    /* 첫 화면 제목: 한 줄 + 주황 밑줄, 배경에 분자 구조(벤젠 고리) 선 그림 */
    .hero::after { display: none; }
    .hero-mol {
      position: absolute; right: -34px; top: 50%; transform: translateY(-50%);
      width: 230px; height: 230px; opacity: .2; pointer-events: none;
    }
    .hero-title {
      margin: 22px 0 0; white-space: nowrap;
      font-size: clamp(25px, 8.1vw, 42px); line-height: 1.2; font-weight: 800; letter-spacing: -.045em;
    }
    .hero-title::after {
      content: ""; display: block; width: 2.2em; height: 4px; margin-top: 12px;
      border-radius: 2px; background: #f7963c;
    }
    .hero-title:focus, .band-title:focus { outline: none; }

    .band { padding: calc(10px + var(--safe-t)) 0 26px; }
    .band-p { color: #fff; background: var(--grad-p); }
    .band-o { color: #fff; background: var(--grad-o); }
    .band-o .band-title { text-shadow: 0 1px 2px rgba(120,40,0,.28); }
    .band-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
    .pill {
      display: inline-flex; align-items: center; gap: 2px;
      min-height: 42px; max-width: 80%; padding: 0 15px 0 8px;
      border-radius: 999px; cursor: pointer;
      font-size: 15px; font-weight: 800; letter-spacing: -.02em;
      background: rgba(255,255,255,.17); border: 1px solid rgba(255,255,255,.28); color: inherit;
    }
    .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill-home { width: 42px; padding: 0; justify-content: center; }
    .band-o .pill { background: rgba(0,0,0,.16); border-color: rgba(255,255,255,.3); }
    .pill:active { transform: scale(.96); }
    .band-title {
      margin: 20px 0 0; font-size: 28px; line-height: 1.22; font-weight: 800; letter-spacing: -.04em;
    }
    .band-title.xl { margin-top: 18px; font-size: clamp(30px, 9.4vw, 46px); line-height: 1.1; letter-spacing: -.045em; }
    .band-title .unit-sfx { color: inherit; opacity: .82; }
    .band-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .band-chip {
      padding: 4px 11px; border-radius: 9px; font-size: 14.5px; font-weight: 800;
      background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3);
    }

    /* 스크롤 시 나타나는 상단 막대 */
    .appbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      transform: translateY(-105%); visibility: hidden;
      transition: transform .24s var(--ease), visibility 0s .24s;
      box-shadow: 0 6px 20px rgba(27,22,48,.16);
    }
    .appbar.show { transform: none; visibility: visible; transition: transform .24s var(--ease), visibility 0s; }
    .appbar-p { background: #4f35ba; color: #fff; }
    .appbar-o { background: #e8650f; color: #fff; }
    .appbar-in {
      max-width: 752px; margin: 0 auto;
      display: flex; align-items: center; gap: 2px;
      padding: calc(4px + var(--safe-t)) 12px 4px 4px;
    }
    .ab-back {
      width: 48px; height: 48px; flex: none; border: 0; border-radius: 14px; cursor: pointer;
      display: grid; place-items: center; background: none; color: inherit;
    }
    .ab-back:active { background: rgba(255,255,255,.16); }
    .ab-title {
      flex: 1; min-width: 0; font-size: 17px; font-weight: 800; letter-spacing: -.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ================= 공정 선택 (첫 화면) ================= */
    .unit-list { display: grid; gap: 8px; }
    .unit-row {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 8px;
      min-height: 60px; padding: 10px 10px 10px 18px;
      background: #fff; border: 1px solid var(--line); border-radius: 18px;
      box-shadow: var(--sh-1);
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    }
    .unit-row::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
      background: linear-gradient(180deg, var(--p-500), var(--p-700));
    }
    .unit-row:active { transform: scale(.985); border-color: var(--p-200); }
    @media (hover: hover) { .unit-row:hover { border-color: var(--p-200); box-shadow: var(--sh-2); } }
    .ur-main {
      flex: 1; min-width: 0;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      column-gap: 10px; row-gap: 5px;
    }
    .ur-name {
      font-size: clamp(19px, 5.8vw, 24px); font-weight: 800;
      letter-spacing: -.035em; line-height: 1.2; color: var(--ink); white-space: nowrap;
    }
    .unit-sfx { font-weight: 700; color: #6a6484; }
    .ur-chips { display: flex; flex-wrap: wrap; gap: 3px; }
    .unit-list.stacked .ur-main { flex-direction: column; align-items: flex-start; row-gap: 3px; }
    .chip {
      display: inline-block; padding: 1px 5px; border-radius: 6px;
      font-size: 11.5px; font-weight: 700; line-height: 1.6; letter-spacing: -.01em;
      background: #f3f1f8; color: var(--ink-2); border: 1px solid #e6e2ef;
    }
    .ur-go { flex: none; color: var(--p-400); }

    /* ================= 공통 항목 (주황 타일) ================= */
    .common-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line);
    }
    .c-tile {
      display: flex; flex-direction: column; gap: 12px;
      min-height: 128px; padding: 14px 11px 14px 12px;
      border-radius: 20px; background: var(--o-50); border: 1.5px solid var(--o-200);
      color: var(--o-900);
      transition: transform .14s ease;
    }
    .c-tile:active { transform: scale(.965); }
    .c-ico {
      width: 48px; height: 48px; border-radius: 15px; flex: none;
      display: grid; place-items: center; color: #fff;
      background: linear-gradient(140deg, #f9a651, #e8761a);
      box-shadow: 0 6px 14px rgba(232,118,26,.3);
    }
    .c-title { font-size: 14.5px; font-weight: 800; line-height: 1.32; letter-spacing: -.035em; }

    /* ================= 공정 화면: 공정별 항목 (보라) ================= */
    .items { display: grid; gap: 10px; }
    .item {
      background: #fff; border: 1px solid var(--p-100); border-radius: 22px;
      box-shadow: var(--sh-1); overflow: hidden;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .item.open { border-color: var(--p-200); box-shadow: var(--sh-2); }
    .item-btn {
      display: flex; align-items: center; gap: 14px; width: 100%;
      min-height: 76px; padding: 14px 14px 14px 14px;
      border: 0; background: none; text-align: left; cursor: pointer;
    }
    .item-btn:active .item-ico { transform: scale(.94); }
    .item-ico {
      width: 52px; height: 52px; border-radius: 16px; flex: none;
      display: grid; place-items: center; color: #fff;
      background: linear-gradient(140deg, var(--p-700), var(--p-500));
      box-shadow: 0 8px 16px rgba(101,72,214,.28);
      transition: transform .14s ease;
    }
    .item-title { flex: 1; min-width: 0; font-size: 18.5px; font-weight: 800; letter-spacing: -.035em; line-height: 1.3; }
    .chev { flex: none; color: var(--faint); display: grid; place-items: center; }
    .item .chev-d .ic { transition: transform .28s var(--ease); }
    .item.open .chev-d .ic { transform: rotate(180deg); color: var(--p-600); }

    .sub-wrap {
      display: grid; grid-template-rows: 0fr; visibility: hidden;
      transition: grid-template-rows .3s var(--ease), visibility 0s .3s;
    }
    .item.open .sub-wrap { grid-template-rows: 1fr; visibility: visible; transition: grid-template-rows .3s var(--ease), visibility 0s; }
    .sub-inner { min-height: 0; overflow: hidden; }
    .sub-grid { display: grid; gap: 8px; padding: 2px 12px 12px; }
    .sub-btn {
      display: flex; align-items: center; gap: 12px;
      min-height: 60px; padding: 9px 10px;
      border-radius: 16px; background: var(--p-50); border: 1px solid var(--p-100);
      transition: transform .12s ease;
    }
    .sub-btn:active { transform: scale(.98); }
    .sub-code {
      flex: none; min-width: 74px; padding: 7px 8px; border-radius: 11px; text-align: center;
      background: #fff; border: 1px solid var(--p-200);
      color: var(--p-700); font-size: 15px; font-weight: 800; letter-spacing: -.02em;
    }
    .sub-label { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; letter-spacing: -.02em; }

    /* ================= 자료 화면 ================= */
    .tabs {
      display: flex; gap: 8px; overflow-x: auto;
      margin: 0 -16px 2px; padding: 2px 16px 18px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: none; display: inline-flex; align-items: center; gap: 7px;
      min-height: 48px; padding: 0 17px; border-radius: 999px;
      border: 1.5px solid var(--p-200); background: #fff;
      color: var(--p-700); font-size: 15.5px; font-weight: 800; white-space: nowrap;
      transition: background .15s ease, color .15s ease;
    }
    .tab small { font-size: 13px; font-weight: 700; color: var(--muted); }
    .tab[aria-current="page"] {
      background: var(--p-600); border-color: var(--p-600); color: #fff;
      box-shadow: 0 8px 18px rgba(101,72,214,.3);
    }
    .tab[aria-current="page"] small { color: rgba(255,255,255,.85); }

    .imgbox { margin: 0; }
    .img-frame {
      position: relative; overflow: hidden;
      background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--sh-1);
    }
    .img-hit { position: relative; display: block; width: 100%; padding: 0; border: 0; background: #fff; cursor: zoom-in; }
    .img-hit img { display: block; width: 100%; height: auto; }
    .img-zoom {
      position: absolute; right: 12px; bottom: 12px;
      width: 46px; height: 46px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(27,22,48,.72); color: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,.2);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .img-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; min-height: 240px; padding: 28px 20px; text-align: center;
    }
    .img-loading .spinner { width: 34px; height: 34px; border-width: 4px; }
    .img-error { background: #fbfaff; }
    .err-ico { color: var(--faint); }
    .err-text { margin: 0; font-size: 15px; font-weight: 800; color: var(--ink-2); }
    .err-file {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px;
      color: var(--muted); background: #f1eff6; padding: 3px 8px; border-radius: 6px; word-break: break-all;
    }
    .err-retry {
      min-height: 44px; padding: 0 20px; border-radius: 999px; cursor: pointer;
      border: 1.5px solid var(--line); background: #fff; font-size: 14.5px; font-weight: 800;
    }

    /* ================= 공정 내 비상대피로 지도 =================
       지도 높이 --H 를 기준으로 원형 버튼이 함께 커지고 작아짐 (--u = 지도 1칸의 화면 크기)
       초록 = 계단 / 파랑 = 수직사다리 / 네모 테두리 = 계단실 안의 계단                         */
    .evm {
      --st: #15803d; --st-50: #eaf7ef; --st-ring: rgba(21,128,61,.32);
      --ld: #2155d6; --ld-50: #edf2fd; --ld-ring: rgba(33,85,214,.32);
      --room: #2a2340;
      --H: 420px;
      --H: clamp(400px, calc(100vh - 230px), 440px);
      --H: clamp(400px, calc(100svh - 230px), 440px);
      --u: calc(var(--H) / 525);
      position: relative; overflow: hidden;
      background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--sh-1);
    }
    .evm-stage {
      overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      padding: 46px 12px 12px; background: #f3f1f8;      /* 위쪽 46px = 범례 자리 (지도·원을 가리지 않게) */
    }
    .evm-stage::-webkit-scrollbar { display: none; }
    .evm-track { position: relative; width: calc(var(--H) * 2.862857); height: var(--H); }
    .evm-board {
      position: absolute; left: 0; top: 0; width: calc(var(--H) * 2.862857); height: var(--H);
      transform-origin: 0 0; border-radius: calc(var(--u) * 10); background: #fff;
    }
    .evm-board.pop { animation: evmPop .3s var(--ease); }
    @keyframes evmPop { from { opacity: .2; } }
    .evm-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: inherit; }

    /* 지도 위 원형 버튼 */
    .evm-pt {
      position: absolute; z-index: 2;
      width: calc(var(--u) * 44); height: calc(var(--u) * 44);
      margin: calc(var(--u) * -22) 0 0 calc(var(--u) * -22); padding: 0;
      display: grid; place-items: center; cursor: pointer;
      border: calc(var(--u) * 3.4) solid #fff; border-radius: 50%;
      color: #fff; font-size: calc(var(--u) * 20); font-weight: 800; line-height: 1; letter-spacing: -.04em;
      box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 9) rgba(20,16,40,.34);
      transition: transform .2s var(--ease), opacity .2s ease, box-shadow .2s ease;
    }
    .evm-pt.stair { background: var(--st); }
    .evm-pt.ladder { background: var(--ld); }
    .evm-pt::after { content: ""; position: absolute; inset: calc(var(--u) * -9); border-radius: 50%; }   /* 누르는 범위 넓힘 */
    .evm-pt.room::before {
      content: ""; position: absolute; left: 50%; top: 50%; z-index: -1; pointer-events: none; box-sizing: border-box;
      width: calc(var(--u) * 24.4); height: calc(var(--u) * 24.4); margin: calc(var(--u) * -12.2) 0 0 calc(var(--u) * -12.2);
      border: calc(var(--u) * 2.4) solid rgba(6, 36, 20, .42);
    }
    .evm-pt:active { transform: scale(.92); }
    .evm.has-sel .evm-pt:not(.on) { opacity: .55; }
    .evm-pt.on { z-index: 3; transform: scale(1.2); }
    .evm-pt.on.stair { box-shadow: 0 0 0 calc(var(--u) * 5) var(--st-ring), 0 calc(var(--u) * 4) calc(var(--u) * 12) rgba(20,16,40,.4); }
    .evm-pt.on.ladder { box-shadow: 0 0 0 calc(var(--u) * 5) var(--ld-ring), 0 calc(var(--u) * 4) calc(var(--u) * 12) rgba(20,16,40,.4); }
    .evm-pt.on::after { border: calc(var(--u) * 3) solid currentColor; animation: evmPulse 1.6s ease-out infinite; }
    .evm-pt.on.stair::after { color: var(--st); }
    .evm-pt.on.ladder::after { color: var(--ld); }
    @keyframes evmPulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }

    /* 범례 — 지도 카드 왼쪽 위에 고정 (지도를 좌우로 밀어도 그 자리 그대로)
       지도 위쪽 여백에 있어 원·지도를 가리지 않음, 손가락으로 끌면 지도가 그대로 밀림 */
    .evm-key {
      position: absolute; left: 12px; top: 7px; z-index: 1; pointer-events: none;
      display: flex; align-items: center; gap: 14px;
      height: 32px; padding: 0 13px 0 7px;
      background: rgba(255,255,255,.95); border: 1px solid #dcd8e7; border-radius: 999px;
      box-shadow: 0 2px 8px rgba(27,22,48,.10);
      font-size: 15px; font-weight: 800; letter-spacing: -.03em; line-height: 1; color: var(--ink); white-space: nowrap;
    }
    .evm-key span { display: inline-flex; align-items: center; gap: 7px; }
    .evm-key i {
      flex: none; width: 20px; height: 20px; border-radius: 50%;
      border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(20,16,40,.38);
    }
    .evm-key .stair i { background: var(--st); }
    .evm-key .ladder i { background: var(--ld); }

    /* 지도 위에 떠 있는 조작 버튼 (지도와 함께 밀리지 않음) */
    .evm-fade {
      position: absolute; top: 0; bottom: 0; width: 34px; z-index: 1; pointer-events: none;
      transition: opacity .2s ease;
    }
    .evm-fade.l { left: 0; background: linear-gradient(90deg, rgba(243,241,248,.95), rgba(243,241,248,0)); }
    .evm-fade.r { right: 0; background: linear-gradient(270deg, rgba(243,241,248,.95), rgba(243,241,248,0)); }
    .evm-edge {
      position: absolute; top: 50%; z-index: 5; margin-top: -22px;
      width: 44px; height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 50%; cursor: pointer;
      display: grid; place-items: center; background: rgba(255,255,255,.95); color: var(--ink);
      box-shadow: 0 4px 14px rgba(27,22,48,.18);
      transition: opacity .2s ease, transform .15s ease;
    }
    .evm-edge.l { left: 8px; }
    .evm-edge.r { right: 8px; }
    .evm-edge:active { transform: scale(.92); }
    .evm-fab {
      position: absolute; z-index: 1;             /* 원보다 아래 층 — 버튼이 원을 가리지 않게 */
      display: inline-flex; align-items: center; gap: 6px;
      height: 40px; padding: 0 14px 0 11px; border: 0; border-radius: 999px; cursor: pointer;
      background: rgba(27,22,48,.84); color: #fff; font-size: 14px; font-weight: 800; letter-spacing: -.02em;
      box-shadow: 0 6px 16px rgba(27,22,48,.25);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      transition: opacity .2s ease, transform .15s ease;
    }
    .evm-fab:active { transform: scale(.95); }
    .evm-fab.fit { left: 10px; bottom: 10px; }
    .evm.at-start .evm-fade.l, .evm.at-start .evm-edge.l,
    .evm.at-end .evm-fade.r, .evm.at-end .evm-edge.r,
    .evm.ov .evm-edge, .evm.ov .evm-fade { opacity: 0; pointer-events: none; }
    .evm.ov .evm-stage { cursor: zoom-in; }
    .evm.ov .evm-pt { pointer-events: none; }

    /* 지도 아래 사진 창 */
    .evp {
      --c: #15803d; --c50: #eaf7ef;
      margin-top: 12px; overflow: hidden;
      background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--sh-1);
      animation: evpIn .35s var(--ease) backwards;
    }
    .evp.ladder { --c: #2155d6; --c50: #edf2fd; }
    @keyframes evpIn { from { opacity: 0; transform: translateY(14px); } }
    .evp-head {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 10px 12px 14px; border-top: 5px solid var(--c);
    }
    .evp-badge {
      flex: none; width: 46px; height: 46px; border-radius: 50%;
      display: grid; place-items: center; background: var(--c); color: #fff;
      font-size: 20px; font-weight: 800; letter-spacing: -.04em;
      box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--c);
    }
    .evp-badge.room { position: relative; isolation: isolate; }
    .evp-badge.room::before {
      content: ""; position: absolute; left: 50%; top: 50%; z-index: -1; box-sizing: border-box;
      width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 2.5px solid rgba(6, 36, 20, .42);
    }
    .evp-tt { flex: 1; min-width: 0; }
    .evp-tt strong { display: block; font-size: 19px; font-weight: 800; letter-spacing: -.03em; line-height: 1.22; color: var(--ink); }
    .evp-tt strong span { white-space: nowrap; }
    .evp-tt .evp-kind { color: var(--c); }
    .evp-nav { flex: none; display: flex; align-items: center; gap: 6px; }
    .evp-nav button {
      width: 44px; height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 14px; cursor: pointer;
      display: grid; place-items: center; background: #fff; color: var(--ink);
    }
    .evp-nav button:active { background: var(--c50); }
    .evp-frame {
      position: relative; aspect-ratio: 4 / 3; overflow: hidden;
      background: #f1eff6; touch-action: pan-y; user-select: none; -webkit-user-select: none;
    }
    .evp-frame > img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in;
      -webkit-user-drag: none;
    }
    .evp-frame > img.from-r { animation: evpFromR .28s var(--ease) both; }
    .evp-frame > img.from-l { animation: evpFromL .28s var(--ease) both; }
    @keyframes evpFromR { from { opacity: 0; transform: translateX(26px); } }
    @keyframes evpFromL { from { opacity: 0; transform: translateX(-26px); } }
    .evp-zoom {
      position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center; pointer-events: none;
      background: rgba(27,22,48,.72); color: #fff;
    }
    .evp-wait { position: absolute; left: 50%; top: 50%; margin: -17px 0 0 -17px; width: 34px; height: 34px; border-width: 4px; }
    .evp-empty {
      position: absolute; inset: 0; padding: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
      background-color: #fbfaff;
      background-image: radial-gradient(circle, #e4e0ef 1.2px, transparent 1.3px); background-size: 18px 18px;
    }
    .evp-empty-ico {
      width: 76px; height: 76px; border-radius: 50%;
      display: grid; place-items: center; color: var(--c); background: #fff;
      border: 2px dashed var(--c);
    }
    .evp-empty p { margin: 0; font-size: 16px; font-weight: 800; color: var(--ink-2); }
    .evp-empty code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px;
      color: var(--muted); background: #fff; border: 1px solid var(--line); padding: 3px 9px; border-radius: 7px;
    }
    @media (min-width: 640px) {
      .evm { --H: clamp(380px, calc(100svh - 260px), 480px); }
      .evp-frame { aspect-ratio: 16 / 10; }
    }
    @media (max-width: 359px) {
      .evp-head { gap: 9px; padding-left: 10px; }
      .evp-badge { width: 40px; height: 40px; font-size: 18px; }
      .evp-tt strong { font-size: 17px; }
      .evp-nav button { width: 40px; }
    }

    /* 전체화면 창의 원형 버튼 (공용) */
    .pin {
      --pin: 38px;
      position: absolute; z-index: 1;
      width: var(--pin); height: var(--pin); margin: calc(var(--pin) / -2) 0 0 calc(var(--pin) / -2); padding: 0;
      display: grid; place-items: center;
      border: 3px solid #fff; border-radius: 50%; cursor: pointer;
      background: var(--g-600); color: #fff; font-size: calc(var(--pin) * .4); font-weight: 800; line-height: 1;
      box-shadow: 0 4px 12px rgba(8,85,58,.35);
    }

    /* ================= 오프라인 알림 ================= */
    .offline-toast {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); z-index: 200;
      display: none; align-items: center; gap: 10px;
      max-width: 520px; margin: 0 auto; padding: 12px 14px; border-radius: 14px;
      background: #2a2340; color: #fff; font-size: 14px; font-weight: 700; line-height: 1.5;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }
    body.offline .offline-toast { display: flex; }

    /* ================= 전체화면 이미지 창 ================= */
    .viewer { position: fixed; inset: 0; z-index: 4000; display: flex; flex-direction: column; background: #16112a; }
    .viewer-bar {
      flex: none; display: flex; align-items: center; gap: 8px;
      padding: calc(8px + var(--safe-t)) 10px 8px 14px;
      background: rgba(22,17,42,.96); border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .viewer-title {
      flex: 1; min-width: 0; font-size: 14.5px; font-weight: 800; color: #fff;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .v-bar-btn {
      flex: none; display: inline-flex; align-items: center; gap: 5px;
      min-height: 42px; padding: 0 13px; border: 0; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,.14); color: #fff; font-size: 13.5px; font-weight: 800;
    }
    .viewer-stage {
      flex: 1; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    /* 확대·이동은 canvas(이미지 + 원형 버튼)에 적용. 손을 떼면 will-change 를 풀어 벡터 지도가 다시 선명하게 그려짐 */
    .viewer-canvas { position: relative; flex: none; transform-origin: center center; }
    .viewer-canvas.moving { will-change: transform; }
    .viewer-img { display: block; width: 100%; height: 100%; -webkit-user-drag: none; }
    .viewer-pins { position: absolute; inset: 0; }
    .viewer .pin { --pin: 38px; transform: scale(var(--k, 1)); }
    .viewer .pin:active { transform: scale(calc(var(--k, 1) * .92)); }
    .viewer-spin {
      position: absolute; left: 50%; top: 50%; margin: -22px 0 0 -22px;
      border-color: rgba(255,255,255,.18); border-top-color: #fff;
    }
    .viewer-msg { margin: 0; padding: 20px; color: rgba(255,255,255,.85); font-size: 15px; font-weight: 700; text-align: center; }
    .viewer-hint {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
      margin: 0; padding: 7px 14px; border-radius: 999px; white-space: nowrap; pointer-events: none;
      background: rgba(0,0,0,.5); color: rgba(255,255,255,.92); font-size: 12px; font-weight: 700;
      transition: opacity .4s ease;
    }
    .viewer-hint.gone { opacity: 0; }
    .viewer-tools {
      flex: none; display: flex; align-items: center; justify-content: center; gap: 9px;
      padding: 10px 12px calc(12px + var(--safe-b));
      background: rgba(22,17,42,.96); border-top: 1px solid rgba(255,255,255,.1);
    }
    .v-btn {
      min-width: 56px; min-height: 46px; padding: 0 10px; border: 0; border-radius: 13px; cursor: pointer;
      display: inline-grid; place-items: center;
      background: rgba(255,255,255,.14); color: #fff; font-size: 14px; font-weight: 800;
    }
    .v-btn.wide { min-width: 96px; }

    /* ================= 화면 크기별 ================= */
    @media (min-width: 640px) {
      .hero { padding: calc(26px + var(--safe-t)) 0 40px; border-radius: 0 0 38px 38px; }
      .hero-title { font-size: 44px; }
      .hero-mol { width: 300px; height: 300px; right: 4%; }
      .band { border-radius: 0 0 38px 38px; }
      .band-title { font-size: 34px; }
      .unit-list { grid-template-columns: 1fr 1fr; }
      .ur-name { font-size: 24px; }
      .c-tile { min-height: 112px; flex-direction: row; align-items: center; }
      .c-title { font-size: 16px; }
      .tabs { margin: 0 0 2px; padding: 2px 0 18px; flex-wrap: wrap; overflow: visible; }
    }
    @media (max-width: 359px) {
      .wrap { padding-left: 12px; padding-right: 12px; }
      .band-in { padding: 0 12px; }
      .unit-row { padding-left: 15px; }
      .c-tile { padding: 12px 9px; }
      .c-title { font-size: 13px; }
      .c-ico { width: 42px; height: 42px; }
      .item-title { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }
    @media print {
      .gate, .appbar, .viewer, .offline-toast, .band-nav, .img-zoom { display: none !important; }
      .app { display: block !important; }
      body { background: #fff; }
      .hero, .band { background: none !important; color: #000 !important; border: 2px solid #000; }
    }
  </style>
</head>
<body>

  <!-- ================= 위치 확인 게이트 ================= -->
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <button type="button" class="gate-bypass" id="gate-bypass" aria-label="검토용 바로 보기" hidden></button>
    <div class="gate-card">
      <div class="spinner" id="gate-spinner"></div>
      <div class="gate-icon" id="gate-icon" hidden></div>
      <h1 class="gate-title" id="gate-title">위치 확인 중</h1>
      <p class="gate-desc" id="gate-desc" hidden></p>
      <button type="button" class="gate-btn" id="gate-btn" hidden></button>
    </div>
  </div>

  <!-- ================= 본문 (스크립트가 화면을 그림) ================= -->
  <div class="app" id="view"></div>

  <div class="offline-toast" role="status" id="offline-toast"></div>

  <!-- ================= 전체화면 이미지 창 ================= -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
    <div class="viewer-bar">
      <span class="viewer-title" id="viewer-title"></span>
      <a class="v-bar-btn" id="v-ext" target="_blank" rel="noopener">새 창</a>
      <button type="button" class="v-bar-btn" id="v-close">닫기</button>
    </div>
    <div class="viewer-stage" id="viewer-stage">
      <div class="viewer-canvas" id="viewer-canvas">
        <img class="viewer-img" id="viewer-img" alt="" draggable="false" />
        <div class="viewer-pins" id="viewer-pins"></div>
      </div>
      <span class="spinner viewer-spin" id="viewer-spin" aria-label="불러오는 중" hidden></span>
      <p class="viewer-msg" id="viewer-msg" hidden>이미지를 불러올 수 없습니다.</p>
      <p class="viewer-hint" id="viewer-hint">두 손가락으로 확대 · 두 번 탭하면 확대/축소</p>
    </div>
    <div class="viewer-tools">
      <button type="button" class="v-btn" id="v-out" aria-label="축소"></button>
      <button type="button" class="v-btn wide" id="v-reset">전체 보기</button>
      <button type="button" class="v-btn" id="v-in" aria-label="확대"></button>
    </div>
  </div>

  <script>
  "use strict";

  /* =====================================================================
   * 1. 설정 — 내용 변경은 대부분 이 영역에서만 하면 됩니다.
   * =================================================================== */
  const IMAGE_BASE = "./";          // 이미지 폴더. 예) "./images/"
  const LOGO_NAME = "logo";
  const REVIEW_BYPASS = true;       // 검토용 숨은 버튼(위치 확인 화면 오른쪽 위). 배포 시 false
  const ACCESS_KEEP_MIN = 30;       // 위치 확인 후 같은 창에서 다시 묻지 않는 시간(분)

  // 취급 물질 (MSDS 요약 이미지는 물질별 1장)
  const SUBSTANCES = {
    h2s:    { code: "H₂S",      label: "황화수소",          file: "h2s" },
    pt:     { code: "PT",       label: "프로필렌 테트라머",   file: "pt" },
    tdm:    { code: "TDM",      label: "Tertiary Dodecyl Mercaptan", file: "tdm" },
    nom:    { code: "NOM",      label: "노말옥틸머캅탄",      file: "nom" },
    octene: { code: "1-Octene", label: "1-옥텐",            file: "octene" },
    naoh:   { code: "NaOH",     label: "수산화나트륨",        file: "naoh" },
    nash:   { code: "NaSH",     label: "황화수소나트륨",      file: "nash" },

  function parseRoute(hash) {
    const p = String(hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    if (p[0] === "c" && COMMON_BY_KEY[p[1]]) return { view: "common", unit: null, item: COMMON_BY_KEY[p[1]] };

    const item = UNIT_ITEM_BY_KEY[p[2]];

    const r = { view: "item", unit: unit, item: item };
    if (item.type === "msds") r.sub = unit.substances.indexOf(p[3]) >= 0 ? p[3] : unit.substances[0];

  // 이미지 파일은 확장자 없이 이름만 지정 → 아래 확장자(소문자·대문자)를 한꺼번에 찾아봄
  //   같은 이름이 여러 개 있으면 앞 순서(png → jpg → jpeg → webp → gif → svg → bmp → avif)가 우선
  const IMG_TYPES = ["png", "jpg", "jpeg", "webp", "gif", "svg", "bmp", "avif"];
  function extList(first) {             // first: 먼저 찾을 확장자 (사진은 jpg)
    const t = first ? [first].concat(IMG_TYPES.filter(function (e) { return e !== first; })) : IMG_TYPES;
    return t.map(function (e) { return "." + e; }).concat(t.map(function (e) { return "." + e.toUpperCase(); }));
  }
  const IMG_EXTS = extList();
  const imgFound = {};                  // 이름 → 찾은 주소 (없으면 false)
  function findImage(name, exts, done, fresh) {
    if (!fresh && imgFound[name]) { done(imgFound[name]); return; }
    if (!fresh && imgFound[name] === false) { done(null); return; }
    const urls = exts.map(function (e) { return IMAGE_BASE + name + e; });
    const st = urls.map(function () { return 0; });       // 0 확인 중 · 1 있음 · -1 없음
    let fin = false;
    function settle() {
      if (fin) return;
      for (let i = 0; i < st.length; i++) {
        if (st[i] === 0) return;                           // 앞 순서 결과를 기다림
        if (st[i] === 1) { fin = true; imgFound[name] = urls[i]; done(urls[i]); return; }
      }
      fin = true; if (navigator.onLine) imgFound[name] = false; done(null);
    }
    urls.forEach(function (u, i) {                         // 동시에 확인 → 확장자가 많아도 빠름
      const im = new Image();
      im.onload = function () { st[i] = 1; settle(); };
      im.onerror = function () { st[i] = -1; settle(); };
      im.src = fresh ? u + "?t=" + Date.now() : u;
    });
  }

  function imageBlock(file, label) {
    return '<figure class="imgbox rise" style="--i:1" data-name="' + esc(file) + '" data-label="' + esc(label) + '">' +

          '<img alt="' + esc(label) + '">' +
          '<span class="img-zoom">' + svg("zoom", 22) + '</span>' +
        '</button>' +
        '<div class="img-state img-error" hidden>' +
          '<span class="err-ico">' + svg("image", 32) + '</span>' +
          '<p class="err-text"></p>' +
          '<code class="err-file">' + esc(file) + '.png</code>' +
          '<button type="button" class="err-retry">다시 시도</button>' +
        '</div>' +
      '</div></figure>';
  }

  function evName(p) { return (p.at ? p.at + " " : "") + EV_TYPES[p.type].name; }
  function evFile(p) { return EV_TYPES[p.type].file + p.no; }        // stair1 ~ stair15, ladder1 ~ ladder10

  function evacMap() {
    const markers = EV_LIST.map(function (p) {
      return '<button type="button" class="evm-pt ' + p.type + (p.room ? ' room' : '') + '" data-ev="' + p.id + '" ' +
        'style="left:' + p.x + '%;top:' + p.y + '%" aria-pressed="false" aria-label="' + esc(evName(p) + " " + p.no + "번") + '">' + p.no + '</button>';
    }).join("");
    return '<section class="evm rise" style="--i:1" id="evm" aria-label="공정 내 비상대피로 지도">' +
        '<div class="evm-stage" id="evm-stage"><div class="evm-track" id="evm-track"><div class="evm-board" id="evm-board">' +
          EVAC_SVG + markers +
        '</div></div></div>' +
        '<span class="evm-fade l"></span><span class="evm-fade r"></span>' +
        '<div class="evm-key" aria-hidden="true">' +
          '<span class="stair"><i></i>계단</span><span class="ladder"><i></i>수직사다리</span>' +
        '</div>' +
        '<button type="button" class="evm-edge l" data-evm="left" aria-label="지도 왼쪽 보기">' + svg("back", 22, 2.6) + '</button>' +
        '<button type="button" class="evm-edge r" data-evm="right" aria-label="지도 오른쪽 보기">' + svg("chevR", 22, 2.6) + '</button>' +
        '<button type="button" class="evm-fab fit" data-evm="fit"></button>' +
      '</section>' +
      '<section class="evp" id="evp" hidden aria-live="polite">' +
        '<div class="evp-head">' +
          '<span class="evp-badge" id="evp-badge"></span>' +
          '<div class="evp-tt"><strong id="evp-title"></strong></div>' +
          '<div class="evp-nav">' +
            '<button type="button" data-evp="-1" aria-label="이전 위치">' + svg("back", 20, 2.6) + '</button>' +
            '<button type="button" data-evp="1" aria-label="다음 위치">' + svg("chevR", 20, 2.6) + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="evp-frame" id="evp-frame"></div>' +
      '</section>';
  }

  // 원형 버튼 (공정 지도 화면·전체화면 지도 공용)
  function pinButtons(pins, attr) {
    return pins.map(function (p, i) {
      return '<button type="button" class="pin" style="left:' + Number(p.x) + '%;top:' + Number(p.y) + '%" ' + attr + '="' + i +
        '" aria-label="비상대피로 ' + esc(p.no) + ' ' + esc(p.label) + '">' + esc(p.no) + '</button>';
    }).join("");
  }
  function openPin(p) {
    openViewer(IMAGE_BASE + p.image, "비상대피로 " + p.no + " · " + p.label);
  }

  // 첫 화면 배경의 분자 구조(벤젠 고리) 선 그림
  const HERO_MOL =
    '<svg class="hero-mol" viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true" focusable="false">' +
      '<path d="M70 40L100 57V92L70 109L40 92V57Z"/><path d="M48 62V87M70 101L92 88M92 62L70 49" stroke-width="3"/>' +
      '<path d="M100 92L130 109V144L100 161L70 144V109"/><path d="M122 114V139M100 153L78 140" stroke-width="3"/>' +
      '<path d="M100 57L130 40L160 57V92L130 109"/><path d="M130 144L160 161M40 92L14 107M70 40V10"/>' +
      '<g fill="#fff" stroke="none"><circle cx="70" cy="10" r="7"/><circle cx="14" cy="107" r="7"/><circle cx="160" cy="161" r="7"/><circle cx="130" cy="40" r="5"/></g>' +
    '</svg>';

  function viewHome() {
    return '<header class="hero">' + HERO_MOL + '<div class="band-in">' +
        '<span class="logo-chip' + (imgFound[LOGO_NAME] === false ? ' fallback' : '') + '">' +
          '<img data-logo alt="이수스페셜티케미컬"' + (imgFound[LOGO_NAME] ? ' src="' + esc(imgFound[LOGO_NAME]) + '"' : ' hidden') + '>' +
          '<span>이수스페셜티케미컬</span></span>' +
        '<h1 class="hero-title" tabindex="-1" data-focus>유해화학물질 정보제공</h1>' +
      '</div></header>' +
      '<main class="wrap">' +
        '<nav class="unit-list" aria-label="공정 선택">' + UNITS.map(unitRow).join("") + '</nav>' +
        commonGrid(null, UNITS.length) +
      '</main>';
  }

  function viewUnit(r) {
    const u = r.unit;
    const chips = '<div class="band-chips"><span class="sr">취급 물질: </span>' + u.substances.map(function (k) {
      return '<span class="band-chip">' + esc(SUBSTANCES[k].code) + '</span>';
    }).join("") + '</div>';
    return band({ tone: "p", back: backLabel(r), title: unitFull(u), titleHtml: unitHtml(u), xl: true, chips: chips }) +
      '<main class="wrap">' +
        '<div class="items">' + UNIT_ITEMS.map(function (it, i) { return unitItem(u, it, i); }).join("") + '</div>' +
        commonGrid(u, UNIT_ITEMS.length) +
      '</main>';
  }

  function viewItem(r) {
    const u = r.unit, it = r.item;
    let top = "", file, label;
    if (it.type === "msds") {
      const s = SUBSTANCES[r.sub];
      top = '<nav class="tabs rise" aria-label="물질 선택">' + u.substances.map(function (k) {
          const x = SUBSTANCES[k];
          return '<button type="button" class="tab" data-nav="#/u/' + u.id + '/msds/' + k + '" data-replace' +
            (k === r.sub ? ' aria-current="page"' : '') + '>' + esc(x.code) + '<small>' + esc(x.label) + '</small></button>';
        }).join("") + '</nav>';
      file = s.file;
      label = s.label + "(" + s.code + ") MSDS 요약 정보";
    } else {
      file = it.file.replace("{u}", u.id);
      label = unitFull(u) + " · " + it.title;
    }
    return band({ tone: "p", back: backLabel(r), home: true, title: it.title }) +
      '<main class="wrap">' + top + imageBlock(file, label) + '</main>';
  }

  function viewCommon(r) {
    const c = r.item;
    const body = c.type === "map" ? evacMap() : imageBlock(c.file, c.title);
    return band({ tone: "o", back: backLabel(r), home: !!r.unit, title: c.title }) +
      '<main class="wrap">' + body + '</main>';
  }

  // 공정 버튼: 한 줄에 안 들어가는 버튼이 하나라도 있으면 전체를 같은 2줄 형태로 맞춤
  function fitUnitRows() {
    const list = view.querySelector(".unit-list");
    if (!list) return;
    list.classList.remove("stacked");
    const wrapped = Array.prototype.some.call(list.querySelectorAll(".ur-main"), function (m) {
      return m.lastElementChild.offsetTop > m.firstElementChild.offsetTop + 4;
    });
    list.classList.toggle("stacked", wrapped);
  }
  window.addEventListener("resize", fitUnitRows);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitUnitRows);

  // 색띠 제목이 화면 밖으로 나가면 상단 막대 표시
  let appbarIO = null;
  function setupAppbar() {
    if (appbarIO) { appbarIO.disconnect(); appbarIO = null; }
    const bar = document.getElementById("appbar");
    const anchor = view.querySelector(".band-title");
    if (!bar || !anchor || !("IntersectionObserver" in window)) return;
    const back = bar.querySelector(".ab-back");
    appbarIO = new IntersectionObserver(function (entries) {
      const e = entries[entries.length - 1];
      const show = !e.isIntersecting && e.boundingClientRect.height > 0 && e.boundingClientRect.bottom < 60;
      bar.classList.toggle("show", show);
      bar.setAttribute("aria-hidden", String(!show));
      back.tabIndex = show ? 0 : -1;
    }, { rootMargin: "-56px 0px 0px 0px", threshold: 0 });
    appbarIO.observe(anchor);
  }

  // 이동 방식
  //  - 일반 브라우저: 브라우저 기록을 사용 (휴대폰 '뒤로' 버튼 연동, 주소로 화면 공유 가능)
  //  - 기록 기능이 막힌 환경(앱 안 파일 미리보기 등): 주소를 바꾸지 않고 화면 안에서만 이동
  //    → 어떤 환경에서도 버튼을 누를 때 '외부 링크' 확인 창이 뜨지 않음
  let memMode = false;
  let memHash = "#/";
  const memStack = [];
  function curHash() { return memMode ? memHash : location.hash; }
  function toMemMode() { memMode = true; memHash = currentHash || "#/"; }

  function render(opts) {
    opts = opts || {};
    const prevY = window.scrollY;
    const r = parseRoute(curHash());
    const key = hashOf(r);
    if (key === currentHash && !opts.force) return;
    if (memMode) memHash = key;
    else if (location.hash !== key && !tryHistory(function () { history.replaceState(hstate(), "", key); })) toMemMode();
    const sameView = opts.keepScroll;
    currentHash = key;

    const st = opts.state || (memMode ? {} : hstate());
    expanded = opts.restore ? (st.expanded || null) : null;

    let html;
    if (r.view === "home") html = viewHome();
    else if (r.view === "unit") html = viewUnit(r);
    else if (r.view === "item") html = viewItem(r);
    else html = viewCommon(r);
    view.innerHTML = html;
    view.classList.remove("enter");
    if (!sameView) { void view.offsetWidth; view.classList.add("enter"); }
    mountImages(view);
    mountEvac(view);
    document.title = titleOf(r);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", r.view === "common" ? "#ee6f15" : "#4f35ba");

    let y = 0;
    if (opts.keepScroll) y = prevY;
    else if (opts.restore && typeof st.scrollY === "number") y = st.scrollY;
    window.scrollTo(0, y);
    setupAppbar();
    fitUnitRows();

    const tab = view.querySelector('.tab[aria-current="page"]');
    if (tab && tab.parentNode.scrollWidth > tab.parentNode.clientWidth) {
      tab.parentNode.scrollLeft = tab.offsetLeft - (tab.parentNode.clientWidth - tab.offsetWidth) / 2;
    }
    if (opts.focusSel) {
      const el = view.querySelector(opts.focusSel);
      if (el) el.focus({ preventScroll: true });
    } else if (opts.focus) {
      const h = view.querySelector("[data-focus]");
      if (h) h.focus({ preventScroll: true });
    }
  }

  /* =====================================================================
   * 6. 이동 (휴대폰 '뒤로' 버튼과 화면 안 '뒤로' 버튼이 같게 동작)
   * =================================================================== */
  function navigate(hash, opts) {
    opts = opts || {};
    const target = hashOf(parseRoute(hash));
    if (target === currentHash) return;
    if (!memMode) {
      const st = hstate();
      const depth = st.depth || 0;
      // 지금 화면의 스크롤·펼침 상태를 기억해 두었다가 '뒤로' 올 때 복원
      const ok = tryHistory(function () {
        history.replaceState(Object.assign({}, st, { scrollY: window.scrollY, expanded: expanded }), "");
        if (opts.replace) history.replaceState({ depth: depth }, "", target);
        else history.pushState({ depth: depth + 1 }, "", target);
      });
      if (!ok) toMemMode();
    }
    if (memMode) {
      if (!opts.replace) memStack.push({ hash: currentHash, scrollY: window.scrollY, expanded: expanded });
      memHash = target;
    }
    render({ keepScroll: opts.keepScroll, focus: !opts.focusSel, focusSel: opts.focusSel });
  }

  function goBack() {
    if (memMode) {
      if (memStack.length) {
        const prev = memStack.pop();
        memHash = prev.hash;
        render({ restore: true, state: prev, focus: true });
      } else {
        navigate(hashOf(parentOf(parseRoute(memHash))), { replace: true });
      }
      return;
    }
    if ((hstate().depth || 0) > 0) history.back();
    else navigate(hashOf(parentOf(parseRoute(location.hash))), { replace: true });
  }

  function toggleItem(btn) {
    const item = btn.closest(".item");
    const willOpen = btn.getAttribute("aria-expanded") !== "true";
    btn.setAttribute("aria-expanded", String(willOpen));
    item.classList.toggle("open", willOpen);
    expanded = willOpen ? btn.getAttribute("data-toggle") : null;
    if (!memMode) tryHistory(function () { history.replaceState(Object.assign({}, hstate(), { expanded: expanded }), ""); });
    if (willOpen) {
      setTimeout(function () {
        const rect = item.getBoundingClientRect();
        if (rect.bottom > window.innerHeight - 12) {
          window.scrollBy({ top: Math.min(rect.bottom - window.innerHeight + 16, rect.top - 72), behavior: "smooth" });
        }
      }, 320);
    }
  }

  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0) return;
    const el = e.target.closest("[data-nav],[data-back],[data-toggle],[data-zoom]");
    if (!el || !view.contains(el)) return;

    if (el.hasAttribute("data-nav")) {
      if (el.hasAttribute("data-replace")) {
        navigate(el.getAttribute("data-nav"), { replace: true, keepScroll: true, focusSel: '.tab[aria-current="page"]' });
      } else {
        navigate(el.getAttribute("data-nav"));
      }
    } else if (el.hasAttribute("data-back")) {
      goBack();
    } else if (el.hasAttribute("data-toggle")) {
      toggleItem(el);
    } else if (el.hasAttribute("data-zoom")) {
      const box = el.closest(".imgbox");
      const img = box.querySelector("img");
      openViewer(img.currentSrc || img.src, box.getAttribute("data-label"));
    }
  });

  window.addEventListener("popstate", function (e) {
    if (memMode) return;
    const st = e.state || {};
    const want = st.viewer === true ? 1 : (Number(st.viewer) || 0);   // 이 기록에서 열려 있어야 할 창 수
    if (want < vStack.length) closeViewerTo(want);
    else if (want > vStack.length) { history.back(); return; }
    render({ restore: true });
  });
  window.addEventListener("hashchange", function () { if (!memMode) render({ restore: true }); });

  /* =====================================================================
   * 7. 이미지 불러오기 (로딩 → 표시 / 실패 시 안내 + 다시 시도)
   * =================================================================== */
  function mountImages(root) {
    const logo = root.querySelector("img[data-logo][hidden]");
    if (logo) findImage(LOGO_NAME, IMG_EXTS, function (url) {
      if (url) { logo.src = url; logo.hidden = false; } else logo.parentNode.classList.add("fallback");
    });
    root.querySelectorAll(".imgbox").forEach(function (box) {
      const img = box.querySelector("img");
      const hit = box.querySelector(".img-hit");
      const loading = box.querySelector(".img-loading");
      const error = box.querySelector(".img-error");
      const name = box.getAttribute("data-name");
      function fail() {
        loading.hidden = true; hit.hidden = true; error.hidden = false;
        box.querySelector(".err-text").textContent = navigator.onLine ? "이미지 준비 중" : "오프라인 상태입니다";
      }
      function load(fresh) {
        error.hidden = true; hit.hidden = true; loading.hidden = false;
        findImage(name, IMG_EXTS, function (url) { if (url) img.src = url; else fail(); }, fresh);
      }
      img.addEventListener("load", function () {
        loading.hidden = true; error.hidden = true; hit.hidden = false;
      });
      img.addEventListener("error", fail);
      box.querySelector(".err-retry").addEventListener("click", function () { load(true); });
      load(false);
    });
  }


  /* =====================================================================
   * 7-1. 공정 내 비상대피로 지도
   *      원형 버튼 또는 범례를 누르면 → 지도 아래 사진 창에 사진 표시
   *      사진 창: 이전/다음 버튼, 사진을 좌우로 밀어 넘기기, 사진을 누르면 크게 보기
   * =================================================================== */
  let evSel = null, evOv = false, evSeq = 0;

  function mountEvac(root) {
    evSel = null; evOv = false;
    const m = root.querySelector("#evm");
    if (!m) return;
    const st = m.querySelector("#evm-stage");
    let raf = 0;
    st.addEventListener("scroll", function () {
      if (!raf) raf = requestAnimationFrame(function () { raf = 0; evEdges(); });
    }, { passive: true });
    m.addEventListener("click", evClick);
    root.querySelector("#evp").addEventListener("click", function (e) {
      const b = e.target.closest("[data-evp]");
      if (b) evStep(Number(b.getAttribute("data-evp")));
    });
    evSwipe(root.querySelector("#evp-frame"));
    evFitLabel();
    evEdges();
  }

  // 지도 좌우 끝에 닿으면 그쪽 화살표·흐림 숨김
  function evEdges() {
    const m = $("#evm"), st = $("#evm-stage");
    if (!m || !st) return;
    const max = st.scrollWidth - st.clientWidth;
    m.classList.toggle("at-start", st.scrollLeft <= 4);
    m.classList.toggle("at-end", st.scrollLeft >= max - 4);
  }

  function evClick(e) {
    if (evOv) {                                   // 전체 보기 중: 누른 곳을 가운데 두고 다시 확대
      if (e.target.closest('[data-evm="fit"]')) { evSetOv(false); return; }
      const bd = $("#evm-board"), r = bd.getBoundingClientRect();
      evSetOv(false, (e.clientX - r.left) / (r.width / bd.offsetWidth));
      return;
    }
    const t = e.target.closest("[data-ev],[data-evm]");
    if (!t) return;
    if (t.hasAttribute("data-ev")) { evSelect(t.getAttribute("data-ev"), { map: "near", page: true }); return; }
    const a = t.getAttribute("data-evm"), st = $("#evm-stage");
    if (a === "left" || a === "right") st.scrollBy({ left: (a === "left" ? -1 : 1) * st.clientWidth * 0.7, behavior: "smooth" });
    else if (a === "fit") evSetOv(true);
  }

  // 전체 보기(지도 전체를 화면 폭에 맞춤) ↔ 확대
  function evSetOv(on, focusX) {
    const st = $("#evm-stage"), tr = $("#evm-track"), bd = $("#evm-board");
    if (!st) return;
    const pad = parseFloat(getComputedStyle(st).paddingLeft) || 0;
    const W = bd.offsetWidth, H = bd.offsetHeight, view = st.clientWidth - pad * 2;
    if (on) {
      if (!evOv) evOv = { left: st.scrollLeft };
      const k = Math.min(1, view / W);
      tr.style.width = W * k + "px"; tr.style.height = H * k + "px";
      bd.style.transform = "scale(" + k + ")";
      st.scrollLeft = 0;
    } else {
      const prev = evOv; evOv = false;
      tr.style.width = ""; tr.style.height = ""; bd.style.transform = "";
      st.scrollLeft = focusX != null ? focusX - view / 2 : (prev ? prev.left : 0);
    }
    $("#evm").classList.toggle("ov", !!evOv);
    bd.classList.remove("pop"); void bd.offsetWidth; bd.classList.add("pop");
    evFitLabel(); evEdges();
  }
  function evFitLabel() {
    const b = document.querySelector('[data-evm="fit"]');
    if (b) b.innerHTML = evOv ? svg("zoom", 18, 2.4) + "<span>확대</span>" : svg("fit", 18, 2.4) + "<span>전체</span>";
  }

  function evSelect(id, opt) {
    const p = EV_BY_ID[id], m = $("#evm");
    if (!p || !m) return;
    opt = opt || {};
    evSel = id;
    m.classList.add("has-sel");
    m.querySelectorAll("[data-ev]").forEach(function (b) {
      const on = b.getAttribute("data-ev") === id;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
    });
    const pt = m.querySelector('.evm-pt[data-ev="' + id + '"]');
    if (opt.map) evShowOnMap(pt, opt.map === "center");
    evPanel(p, opt.dir || 0);
    if (opt.page) requestAnimationFrame(function () { evReveal(pt); });
  }

  // 선택한 원이 지도 화면 안에 보이도록 좌우 이동
  function evShowOnMap(pt, center) {
    const st = $("#evm-stage");
    const pad = parseFloat(getComputedStyle(st).paddingLeft) || 0;
    const x = pad + pt.offsetLeft + pt.offsetWidth / 2, vw = st.clientWidth, sl = st.scrollLeft;
    if (!center && x > sl + 72 && x < sl + vw - 72) return;
    st.scrollTo({ left: x - vw / 2, behavior: "smooth" });
  }

  // 사진 창이 화면 안에 들어오도록 아래로 이동 (선택한 원은 가려지지 않게)
  function evReveal(pt) {
    const panel = $("#evp");
    if (!panel || panel.hidden) return;
    let d = panel.getBoundingClientRect().bottom - window.innerHeight + 12;
    if (d <= 0) return;
    d = Math.min(d, pt.getBoundingClientRect().top - 76);
    if (d > 8) window.scrollBy({ top: d, behavior: "smooth" });
  }

  function evStep(d) {
    if (!evSel) return;
    const i = EV_LIST.indexOf(EV_BY_ID[evSel]);
    const n = EV_LIST[(i + d + EV_LIST.length) % EV_LIST.length];
    evSelect(n.id, { map: "near", dir: d });
  }

  function evPanel(p, dir) {
    const panel = $("#evp"), t = EV_TYPES[p.type];
    panel.hidden = false;
    panel.className = "evp " + p.type;
    const badge = $("#evp-badge");
    badge.textContent = p.no;
    badge.classList.toggle("room", !!p.room);
    $("#evp-title").innerHTML = (p.at ? '<span>' + esc(p.at) + '</span> ' : '') + '<span class="evp-kind">' + t.name + '</span>';
    evPhoto(p, dir);
  }

  // 사진 불러오기: stair1 → .jpg 우선, 나머지 확장자도 함께 찾음
  function evPhoto(p, dir) {
    const fr = $("#evp-frame"), seq = ++evSeq, t = EV_TYPES[p.type];
    const label = evName(p);
    function show(url) {
      if (seq !== evSeq) return;
      fr.setAttribute("data-url", url);
      fr.setAttribute("data-label", label);
      fr.innerHTML = '<img alt="' + esc(label + " 사진") + '" draggable="false"' +
        (dir ? ' class="' + (dir > 0 ? "from-r" : "from-l") + '"' : '') + ' src="' + esc(url) + '">' +
        '<span class="evp-zoom">' + svg("zoom", 22) + '</span>';
    }
    function empty() {
      if (seq !== evSeq) return;
      fr.removeAttribute("data-url");
      fr.innerHTML = '<div class="evp-empty"><span class="evp-empty-ico">' + svg(t.icon, 36, 2.2) + '</span>' +
        '<p>' + (navigator.onLine ? "사진 준비 중" : "오프라인 상태입니다") + '</p>' +
        '<code>' + esc(p.photo || evFile(p) + ".jpg") + '</code></div>';
    }
    const name = p.photo || evFile(p);
    if (imgFound[name] === undefined) {
      fr.removeAttribute("data-url");
      fr.innerHTML = '<span class="spinner evp-wait" aria-label="불러오는 중"></span>';
    }
    findImage(name, p.photo ? [""] : EV_EXTS, function (url) { if (url) show(url); else empty(); });
  }

  // 사진 창: 좌우로 밀면 이전/다음, 누르면 크게 보기
  function evSwipe(fr) {
    let sx = 0, sy = 0, pid = null;
    fr.addEventListener("pointerdown", function (e) { pid = e.pointerId; sx = e.clientX; sy = e.clientY; });
    fr.addEventListener("pointercancel", function () { pid = null; });
    fr.addEventListener("pointerup", function (e) {
      if (e.pointerId !== pid) return;
      pid = null;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) evStep(dx < 0 ? 1 : -1);
      else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && fr.getAttribute("data-url")) {
        openViewer(fr.getAttribute("data-url"), fr.getAttribute("data-label"));
      }
    });
  }

  window.addEventListener("resize", function () {
    if (evOv) evSetOv(true); else evEdges();
  });

  /* =====================================================================
   * 8. 전체화면 이미지 창 (핀치 줌 · 두 번 탭 · 드래그 이동 · 뒤로가기로 닫기)
   *    공정 지도는 원형 버튼과 함께 열림 → 버튼을 누르면 사진이 지도 위에 겹쳐 열리고,
   *    '닫기' 또는 휴대폰 '뒤로'를 누르면 보던 확대 상태 그대로 지도로 돌아옴
   * =================================================================== */
  const viewer = $("#viewer"), vStage = $("#viewer-stage"), vCanvas = $("#viewer-canvas"), vImg = $("#viewer-img");
  const vPins = $("#viewer-pins"), vSpin = $("#viewer-spin");
  const vTitle = $("#viewer-title"), vHint = $("#viewer-hint"), vMsg = $("#viewer-msg"), vExt = $("#v-ext");
  $("#v-in").innerHTML = svg("plus", 22);
  $("#v-out").innerHTML = svg("minus", 22);
  vExt.insertAdjacentHTML("afterbegin", svg("ext", 16));

  const MIN_SCALE = 1, MAX_SCALE = 8;
  let scale = 1, tx = 0, ty = 0;
  const pointers = new Map();
  let pinch = null, pan = null;
  let moved = false, downOnImage = false, downOnPin = false, multiTouch = false;
  let lastTapTime = 0, lastTapX = 0, lastTapY = 0;
  let viewerOpen = false, lastFocused = null, hintTimer = null;
  const vStack = [];         // 열린 창 순서 (예: [공정 지도, 비상대피로 사진])
  let pendingZoom = null;    // 지도로 돌아올 때 되살릴 확대 상태

  function applyTransform() {
    vCanvas.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
    vCanvas.style.setProperty("--k", String(1 / scale));   // 원형 버튼은 확대해도 같은 크기로
  }
  function clampPan() {
    const r = vStage.getBoundingClientRect();
    const maxX = Math.max(0, (vCanvas.offsetWidth * scale - r.width) / 2);
    const maxY = Math.max(0, (vCanvas.offsetHeight * scale - r.height) / 2);
    tx = Math.min(maxX, Math.max(-maxX, tx));
    ty = Math.min(maxY, Math.max(-maxY, ty));
  }
  // 이미지를 화면 안에 들어가는 크기로 (원본보다 크게 늘리지는 않음)
  function layoutCanvas() {
    const r = vStage.getBoundingClientRect();
    const w = vImg.naturalWidth, h = vImg.naturalHeight;
    if (!w || !h || !r.width || !r.height) return;
    const k = Math.min(1, r.width / w, r.height / h);
    vCanvas.style.width = (w * k) + "px";
    vCanvas.style.height = (h * k) + "px";
  }
  // 화면 좌표 → 무대 중심 기준 좌표
  function toCenter(x, y) {
    const r = vStage.getBoundingClientRect();
    return { x: x - r.left - r.width / 2, y: y - r.top - r.height / 2 };
  }
  function zoomTo(next, cx, cy) {
    const r = vStage.getBoundingClientRect();
    const c = toCenter(cx === undefined ? r.left + r.width / 2 : cx, cy === undefined ? r.top + r.height / 2 : cy);
    const prev = scale;
    scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, next));
    const k = scale / prev;
    tx = c.x - (c.x - tx) * k;
    ty = c.y - (c.y - ty) * k;
    clampPan(); applyTransform();
  }
  function resetZoom() { scale = 1; tx = 0; ty = 0; applyTransform(); }
  // 세로로 긴 안내문은 처음부터 화면 폭에 맞춰 크게 (글자 가독성)
  function fitToWidth() {
    const r = vStage.getBoundingClientRect();
    const w = vCanvas.offsetWidth;
    if (!w || !r.width) return;
    const k = r.width / w;
    if (k > 1.05) {
      scale = Math.min(MAX_SCALE, k); tx = 0; ty = 0; clampPan();
      ty = (vCanvas.offsetHeight * scale - r.height) / 2;   // 맨 위부터 보이도록
      clampPan(); applyTransform();
    }
  }

  function afterLoad() {
    vSpin.hidden = true; vMsg.hidden = true; vCanvas.hidden = false;
    layoutCanvas();
    if (pendingZoom) {
      scale = pendingZoom.scale; tx = pendingZoom.tx; ty = pendingZoom.ty; pendingZoom = null;
      clampPan(); applyTransform();
    } else {
      resetZoom(); window.requestAnimationFrame(fitToWidth);
    }
  }
  vImg.addEventListener("load", afterLoad);
  vImg.addEventListener("error", function () { vSpin.hidden = true; vCanvas.hidden = true; vMsg.hidden = false; });

  // 창 하나의 내용 표시 (en = { src, label, pins, zoom })
  function showEntry(en) {
    vTitle.textContent = en.label;
    vImg.alt = en.pins ? en.label + " 지도" : en.label + " 확대 이미지";
    vExt.href = en.src;
    vPins.innerHTML = en.pins ? pinButtons(en.pins, "data-vpin") : "";
    vHint.textContent = en.pins && en.pins.length
      ? "번호 버튼을 누르면 사진이 열립니다 · 두 손가락으로 확대"
      : "두 손가락으로 확대 · 두 번 탭하면 확대/축소";
    pendingZoom = en.zoom || null; en.zoom = null;
    lastTapTime = 0;
    vMsg.hidden = true;
    if (vImg.getAttribute("src") === en.src && vImg.complete && vImg.naturalWidth) {
      afterLoad();
    } else {
      vCanvas.hidden = true; vSpin.hidden = false;
      vImg.src = en.src;
    }
    vHint.classList.remove("gone");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { vHint.classList.add("gone"); }, 2600);
  }
  function openViewer(src, label, pins) {
    if (!viewerOpen) {
      lastFocused = document.activeElement;
      viewer.hidden = false; viewerOpen = true;
      document.body.classList.add("no-scroll");
    } else if (vStack.length) {
      vStack[vStack.length - 1].zoom = { scale: scale, tx: tx, ty: ty };   // 돌아올 때 그대로 보이도록
    }
    vStack.push({ src: src, label: label, pins: pins || null, zoom: null });
    showEntry(vStack[vStack.length - 1]);
    $("#v-close").focus();
    const st = hstate();
    if (!memMode) tryHistory(function () { history.pushState(Object.assign({}, st, { viewer: vStack.length, depth: (st.depth || 0) + 1 }), ""); });
  }
  // 창을 n 개만 남기고 닫음 (0 이면 모두 닫기)
  function closeViewerTo(n) {
    if (vStack.length > n) vStack.length = n;
    if (vStack.length) { showEntry(vStack[vStack.length - 1]); $("#v-close").focus(); }
    else hideViewer();
  }
  function hideViewer() {
    viewer.hidden = true; viewerOpen = false; vStack.length = 0;
    document.body.classList.remove("no-scroll");
    pointers.clear(); pinch = null; pan = null;
    vCanvas.classList.remove("moving");
    vPins.innerHTML = "";
    if (lastFocused && document.contains(lastFocused)) lastFocused.focus({ preventScroll: true });
    lastFocused = null;
  }
  function closeViewer() {
    if (!memMode && hstate().viewer) history.back(); else closeViewerTo(vStack.length - 1);
  }

  vStage.addEventListener("pointerdown", function (e) {
    if (!viewerOpen) return;
    const onPin = !!e.target.closest(".pin");
    // 원형 버튼 위에서는 포인터를 가로채지 않음 → 버튼 누르기가 그대로 동작
    if (!onPin) { try { vStage.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ } }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) { moved = false; multiTouch = false; downOnPin = onPin; downOnImage = vCanvas.contains(e.target); }
    const pts = Array.from(pointers.values());
    if (pts.length === 2) {
      multiTouch = true; pan = null;
      const mx = (pts[0].x + pts[1].x) / 2, my = (pts[0].y + pts[1].y) / 2;
      pinch = { dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), scale: scale, tx: tx, ty: ty, mid: toCenter(mx, my) };
    } else if (pts.length === 1) {
      pan = { x: e.clientX, y: e.clientY, tx: tx, ty: ty };
    }
  });

  vStage.addEventListener("pointermove", function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const pts = Array.from(pointers.values());
    if (pts.length >= 2 && pinch && pinch.dist > 0) {
      moved = true;
      vCanvas.classList.add("moving");
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const m = toCenter((pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2);
      const s = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pinch.scale * d / pinch.dist));
      const qx = (pinch.mid.x - pinch.tx) / pinch.scale, qy = (pinch.mid.y - pinch.ty) / pinch.scale;
      scale = s; tx = m.x - s * qx; ty = m.y - s * qy;
      clampPan(); applyTransform();
    } else if (pts.length === 1 && pan) {
      const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
      if (moved && scale > 1) {
        vCanvas.classList.add("moving");
        tx = pan.tx + dx; ty = pan.ty + dy; clampPan(); applyTransform();
      }
    }
  });

  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    const pts = Array.from(pointers.values());
    if (pts.length === 1) {
      pinch = null;
      pan = { x: pts[0].x, y: pts[0].y, tx: tx, ty: ty };
      return;
    }
    if (pts.length > 0) return;
    pinch = null; pan = null;
    vCanvas.classList.remove("moving");                    // 손을 떼면 선명하게 다시 그림
    if (moved || multiTouch || e.type === "pointercancel" || downOnPin) return;   // 원형 버튼은 click 으로 처리
    const now = Date.now();
    const near = Math.abs(e.clientX - lastTapX) < 30 && Math.abs(e.clientY - lastTapY) < 30;
    if (now - lastTapTime < 320 && near) {                 // 두 번 탭 → 확대/축소
      if (scale > 1.2) resetZoom(); else zoomTo(2.6, e.clientX, e.clientY);
      lastTapTime = 0;
    } else {
      lastTapTime = now; lastTapX = e.clientX; lastTapY = e.clientY;
      if (!downOnImage && scale === 1) closeViewer();     // 이미지 바깥 한 번 탭 → 닫기
    }
  }
  vStage.addEventListener("pointerup", endPointer);
  vStage.addEventListener("pointercancel", endPointer);
  window.addEventListener("pointerup", endPointer);       // 버튼 위에서 시작해 창 밖에서 뗀 경우
  window.addEventListener("pointercancel", endPointer);
  vStage.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoomTo(scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
  }, { passive: false });

  // 전체화면 지도의 원형 버튼 → 사진 열기 (끌어서 움직인 경우는 제외)
  vPins.addEventListener("click", function (e) {
    const b = e.target.closest("[data-vpin]");
    if (!b || (moved && e.detail !== 0)) return;
    const en = vStack[vStack.length - 1];
    const p = en && en.pins ? en.pins[Number(b.getAttribute("data-vpin"))] : null;
    if (p) openPin(p);
  });

  window.addEventListener("resize", function () {
    if (!viewerOpen || vCanvas.hidden) return;
    layoutCanvas(); clampPan(); applyTransform();
  });

  $("#v-in").addEventListener("click", function () { zoomTo(scale * 1.5); });
  $("#v-out").addEventListener("click", function () { zoomTo(scale / 1.5); });
  $("#v-reset").addEventListener("click", resetZoom);
  $("#v-close").addEventListener("click", closeViewer);
  window.addEventListener("keydown", function (e) {
    if (!viewerOpen) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "+" || e.key === "=") zoomTo(scale * 1.5);
    else if (e.key === "-") zoomTo(scale / 1.5);
    else if (e.key === "0") resetZoom();
  });

  /* =====================================================================
   * 9. 온라인 상태
   * =================================================================== */
  $("#offline-toast").innerHTML = svg("alert", 20) + "<span>오프라인 상태입니다</span>";
  function updateOnline() { document.body.classList.toggle("offline", !navigator.onLine); }
  window.addEventListener("online", updateOnline);
  window.addEventListener("offline", updateOnline);

  /* =====================================================================
   * 10. 위치 확인 게이트
   *     ※ 브라우저에서 확인하는 방식이므로 '이용 범위 안내' 수준의 제한입니다.
   * =================================================================== */
  const ACCESS_KEY = "ssc-safety-access";

  function pointInPolygon(lat, lng, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i].lng, yi = poly[i].lat, xj = poly[j].lng, yj = poly[j].lat;
      if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function distanceToPolygonMeters(lat, lng, poly) {
    const R = 6378137, rad = Math.PI / 180;
    const mLat = R * rad, mLng = R * rad * Math.cos(lat * rad);
    const px = lng * mLng, py = lat * mLat;
    let min = Infinity;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const ax = poly[j].lng * mLng, ay = poly[j].lat * mLat;
      const bx = poly[i].lng * mLng, by = poly[i].lat * mLat;
      const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
      let t = len2 === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      min = Math.min(min, Math.hypot(px - (ax + t * dx), py - (ay + t * dy)));
    }
    return min;
  }
  function isWithinFence(lat, lng) {
    return pointInPolygon(lat, lng, GEOFENCE) || distanceToPolygonMeters(lat, lng, GEOFENCE) <= BUFFER_METERS;
  }

  function setGate(state, o) {
    o = o || {};
    $("#gate-spinner").hidden = state !== "checking";
    const icon = $("#gate-icon");
    icon.hidden = state === "checking";
    icon.className = "gate-icon" + (o.tone ? " " + o.tone : "");
    icon.innerHTML = o.icon ? svg(o.icon, 32) : "";
    $("#gate-title").textContent = o.title || "";
    const desc = $("#gate-desc");
    desc.innerHTML = o.desc || "";
    desc.hidden = !o.desc;
    const btn = $("#gate-btn");
    btn.hidden = !o.btnText;
    btn.textContent = o.btnText || "";
  }

  function hasRecentAccess() {
    try {
      const t = Number(sessionStorage.getItem(ACCESS_KEY));
      return t > 0 && Date.now() - t < ACCESS_KEEP_MIN * 60000;
    } catch (e) { return false; }
  }
  function grantAccess(remember) {
    if (remember) { try { sessionStorage.setItem(ACCESS_KEY, String(Date.now())); } catch (e) { /* 무시 */ } }
    document.body.classList.add("access-granted");
    $("#gate").hidden = true;
    fitUnitRows();
    evEdges();
    view.classList.remove("enter"); void view.offsetWidth; view.classList.add("enter");
    const h = view.querySelector("[data-focus]");
    if (h) h.focus({ preventScroll: true });
  }

  function checkLocation() {
    if (!("geolocation" in navigator)) {
      setGate("error", { icon: "alert", tone: "deny", title: "위치를 확인할 수 없습니다",
        desc: "위치 기능을 지원하지 않는 기기 또는 브라우저입니다." });
      return;
    }
    if (window.isSecureContext === false) {
      setGate("error", { icon: "alert", tone: "wait", title: "보안 연결이 필요합니다",
        desc: "https 주소로 접속해 주세요." });
      return;
    }
    setGate("checking", { title: "위치 확인 중" });
    navigator.geolocation.getCurrentPosition(function (pos) {
      if (isWithinFence(pos.coords.latitude, pos.coords.longitude)) {
        grantAccess(true);
      } else {
        setGate("deny", {
          icon: "ban", tone: "deny", title: "접근 구역이 아닙니다",
          desc: "이 안내는 <b>공장 구역</b>에서, <b>관계자에 한하여</b> 이용할 수 있습니다.",
          btnText: "다시 시도"
        });
      }
    }, function (err) {
      let msg;
      if (err.code === 1) msg = "브라우저 설정에서 위치 권한을 허용해 주세요.";
      else if (err.code === 2) msg = "GPS 신호를 찾을 수 없습니다.";
      else msg = "위치 확인 시간이 초과되었습니다.";
      setGate("error", { icon: "pin", tone: "wait", title: "위치 확인이 필요합니다", desc: msg, btnText: "다시 시도" });
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }
  $("#gate-btn").addEventListener("click", checkLocation);

  /* =====================================================================
   * 11. 시작
   * =================================================================== */
  (function start() {
    // QR 바로가기: index.html?u=tdm12 → 해당 공정 화면
    let startHash = location.hash, qs = "";
    try {
      const params = new URLSearchParams(location.search);
      const u = params.get("u");
      if (u && UNIT_BY_ID[u] && (!startHash || startHash === "#" || startHash === "#/")) startHash = "#/u/" + u;
      params.delete("u");
      qs = params.toString();
    } catch (e) { /* 무시 */ }
    const ok = tryHistory(function () {
      history.replaceState(Object.assign({ depth: 0 }, hstate()), "",
        location.pathname + (qs ? "?" + qs : "") + (startHash || "#/"));
    });
    if (!ok) { memMode = true; memHash = startHash || "#/"; }
    try { history.scrollRestoration = "manual"; } catch (e) { /* 무시 */ }

    render({ restore: true });
    updateOnline();

    if (REVIEW_BYPASS) {
      const b = $("#gate-bypass");
      b.hidden = false;
      b.addEventListener("click", function () { grantAccess(false); });
    }
    if (hasRecentAccess()) grantAccess(false);
    else checkLocation();
  })();
  </script>
</body>
</html>
